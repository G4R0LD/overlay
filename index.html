<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>🎃 Halloween Overlay</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden;
               width:100%; height:100%; }
  canvas { display:block; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');

const q = new URLSearchParams(location.search);
const OPT = {
  moon:  q.get('moon')  !== '0',
  bats:  q.get('bats')  !== '0',
  blood: q.get('blood') !== '0',
  eyes:  q.get('eyes')  !== '0',
  scene: q.get('scene') === '1',
  lightning: q.get('lightning') !== '0',
  spider: q.get('spider') !== '0'
};

let W, H;
function resize() {
  W = c.width  = innerWidth;
  H = c.height = innerHeight;
  c.style.width  = W + 'px';
  c.style.height = H + 'px';
}
addEventListener('resize', resize);
resize();

// ---------- ХОЛОДНАЯ ЛУНА ----------
function drawMoon() {
  const mx = W - 150, my = 120, mr = 50;
  
  const g = ctx.createRadialGradient(mx, my, 0, mx, my, mr * 4);
  g.addColorStop(0, 'rgba(150, 220, 255, 0.4)'); 
  g.addColorStop(1, 'rgba(150, 220, 255, 0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(mx, my, mr * 4, 0, Math.PI * 2); ctx.fill();
  
  const m = ctx.createRadialGradient(mx - mr * 0.3, my - mr * 0.3, mr * 0.1, mx, my, mr);
  m.addColorStop(0, '#ffffff'); 
  m.addColorStop(0.7, '#d4ebff'); 
  m.addColorStop(1, '#8bb8e8');
  ctx.fillStyle = m; ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
  
  ctx.fillStyle = 'rgba(120, 160, 200, 0.3)';
  ctx.beginPath(); ctx.arc(mx - 15, my - 10, 10, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + 15, my + 15, 7, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + 5, my - 20, 5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx - 20, my + 20, 4, 0, Math.PI * 2); ctx.fill();
}

// ---------- МОЛНИЯ (Замедлена) ----------
let lightningAlpha = 0;
let lightningTimer = Math.random() * 1000;
function drawLightning() {
  if (!OPT.lightning) return;
  lightningTimer--;
  if (lightningTimer <= 0) {
    lightningAlpha = 0.5 + Math.random() * 0.3;
    lightningTimer = 1500 + Math.random() * 2000; // Реже
  }
  if (lightningAlpha > 0) {
    ctx.fillStyle = `rgba(200, 220, 255, ${lightningAlpha})`;
    ctx.fillRect(0, 0, W, H);
    lightningAlpha -= 0.015; // Медленнее затухает
    if (lightningAlpha < 0) lightningAlpha = 0;
  }
}

// ---------- ЗЕЛЁНЫЕ СВЕТЛЯЧКИ (Медленнее) ----------
class Ember {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W; this.y = Math.random() * H;
    this.size = 1 + Math.random() * 3; 
    this.speedY = 0.05 + Math.random() * 0.2; // Было 0.2-0.8
    this.speedX = (Math.random() - 0.5) * 0.3; 
    this.alpha = 0.1 + Math.random() * 0.7;
  }
  update() {
    this.y -= this.speedY; 
    this.x += this.speedX + Math.sin(this.y * 0.01) * 0.3;
    this.alpha += (Math.random() - 0.5) * 0.05;
    this.alpha = Math.max(0.1, Math.min(0.9, this.alpha));
    if (this.y < -10) this.reset();
  }
  draw() {
    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 4);
    g.addColorStop(0, `rgba(50, 255, 100, ${this.alpha})`); 
    g.addColorStop(1, 'rgba(0, 150, 0, 0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 4, 0, Math.PI * 2); ctx.fill();
  }
}

// ---------- МЫШИ (Замедлены) ----------
class Bat {
  constructor() { this.reset(); }
  reset() {
    this.dir = Math.random() < 0.5 ? 1 : -1;
    this.x = this.dir === 1 ? -60 : W + 60;
    this.baseY = 60 + Math.random() * (H - 120); this.y = this.baseY;
    this.size = 10 + Math.random() * 14; 
    this.speed = 0.4 + Math.random() * 0.8; // Было 1.5-4.0
    this.t = Math.random() * 100; 
    this.amp = 8 + Math.random() * 25;
  }
  update() {
    this.t += 0.05; // Медленнее взмахи
    this.x += this.speed * this.dir;
    this.y = this.baseY + Math.sin(this.t) * this.amp;
    if ((this.dir === 1 && this.x > W + 80) || (this.dir === -1 && this.x < -80)) this.reset();
  }
  draw() {
    ctx.save(); ctx.translate(this.x, this.y);
    if (this.dir === -1) ctx.scale(-1, 1);
    const flap = Math.sin(this.t * 2) * 0.5;
    ctx.fillStyle = 'rgba(10,5,15,0.9)';
    ctx.shadowColor = 'rgba(255,0,60,0.4)'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.ellipse(0, 0, this.size * 0.28, this.size * 0.42, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, -this.size * 0.2); ctx.quadraticCurveTo(-this.size, -this.size * 0.7 - flap * this.size, -this.size * 1.5, this.size * 0.25); ctx.quadraticCurveTo(-this.size * 0.7, 0, 0, this.size * 0.1); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, -this.size * 0.2); ctx.quadraticCurveTo(this.size, -this.size * 0.7 - flap * this.size, this.size * 1.5, this.size * 0.25); ctx.quadraticCurveTo(this.size * 0.7, 0, 0, this.size * 0.1); ctx.fill();
    ctx.restore();
  }
}

// ---------- ГЛАЗА В ТЕМНОТЕ (Медленнее) ----------
class Eyes {
  constructor() { this.respawn(true); }
  respawn(init = false) {
    this.x = 60 + Math.random() * (W - 120);
    this.y = 60 + Math.random() * (H - 120);
    this.gap  = 14 + Math.random() * 18;
    this.size = 4 + Math.random() * 7;
    this.life = 0; 
    this.maxLife = 400 + Math.random() * 500; // Живут намного дольше
    this.delay = init ? Math.random() * 500 : 200 + Math.random() * 800;
  }
  update() {
    if (this.delay > 0) { this.delay--; return; }
    this.life++;
    if (this.life > this.maxLife) this.respawn();
  }
  draw() {
    if (this.delay > 0 || this.life <= 0) return;
    const p = this.life / this.maxLife;
    const alpha = Math.sin(p * Math.PI); // Плавное появление и исчезновение
    const blink = (Math.sin(this.life * 0.03) > 0.95) ? 0.05 : 1; // Редкое моргание
    const g1 = ctx.createRadialGradient(this.x - this.gap / 2, this.y, 0, this.x - this.gap / 2, this.y, this.size * 5);
    g1.addColorStop(0, `rgba(255,50,0,${0.55 * alpha})`); g1.addColorStop(1, 'rgba(255,50,0,0)');
    ctx.fillStyle = g1; ctx.beginPath(); ctx.arc(this.x - this.gap / 2, this.y, this.size * 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(this.x + this.gap / 2, this.y, this.size * 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(255,90,20,${alpha * blink})`;
    ctx.beginPath(); ctx.ellipse(this.x - this.gap / 2, this.y, this.size * 0.6, this.size * blink, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(this.x + this.gap / 2, this.y, this.size * 0.6, this.size * blink, 0, 0, Math.PI * 2); ctx.fill();
  }
}

// ---------- ТЯГУЧАЯ КРОВЬ ----------
class Blood {
  constructor() { this.respawn(); }
  respawn() {
    this.x = Math.random() * W; this.y = -10; this.len = 0;
    this.maxLen = 50 + Math.random() * 150; 
    this.speed = 0.05 + Math.random() * 0.15; // ОЧЕНЬ медленно (было 0.4-1.4)
    this.width = 3 + Math.random() * 4; 
    this.active = false;
    this.timer = 300 + Math.random() * 1000; // Долго ждет перед появлением
  }
  update() {
    if (this.timer > 0) { this.timer--; return; }
    if (!this.active) this.active = true;
    this.len += this.speed;
    if (this.len > this.maxLen) { 
      this.width -= 0.01; // Очень медленно утончается
      if (this.width <= 0) this.respawn(); 
    }
  }
  draw() {
    if (this.len <= 0 || this.width <= 0) return;
    const g = ctx.createLinearGradient(0, this.y, 0, this.y + this.len);
    g.addColorStop(0, 'rgba(90,0,0,0.95)'); 
    g.addColorStop(0.6, 'rgba(160,10,10,0.85)'); 
    g.addColorStop(1, 'rgba(120,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(this.x - this.width / 2, this.y);
    ctx.lineTo(this.x - this.width * 0.15, this.y + this.len * 0.85);
    ctx.arc(this.x, this.y + this.len * 0.85, this.width * 0.55, Math.PI, 0);
    ctx.lineTo(this.x + this.width / 2, this.y); ctx.fill();
  }
}

// ---------- ПАУК (Медленнее) ----------
class Spider {
  constructor() {
    this.x = W * 0.15; this.y = -20;
    this.targetY = 150 + Math.random() * 150;
    this.state = 0; this.timer = 0;
  }
  update() {
    if (!OPT.spider) return;
    if (this.state === 0) {
      this.y += 0.15; // Медленный спуск
      if (this.y >= this.targetY) { this.state = 1; this.timer = 600; } // Долго висит
    } else if (this.state === 1) {
      this.timer--;
      if (this.timer <= 0) this.state = 2;
    } else if (this.state === 2) {
      this.y -= 0.4; // Медленный подъем
      if (this.y < -50) {
        this.targetY = 150 + Math.random() * 200;
        this.x = W * 0.1 + Math.random() * W * 0.8;
        this.state = 0;
      }
    }
  }
  draw() {
    if (!OPT.spider || (this.state === 2 && this.y < 0)) return;
    ctx.strokeStyle = 'rgba(200,200,200,0.3)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(this.x, 0); ctx.lineTo(this.x, this.y); ctx.stroke();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.ellipse(this.x, this.y, 8, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(this.x, this.y - 10, 5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5;
    [-12, -6, 6, 12].forEach(off => {
      ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.quadraticCurveTo(this.x + off*1.5, this.y - 10, this.x + off*2, this.y - 15); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.quadraticCurveTo(this.x + off*1.5, this.y + 10, this.x + off*2, this.y + 15); ctx.stroke();
    });
  }
}

// ---------- ИНИЦИАЛИЗАЦИЯ ----------
const bats  = OPT.bats ? Array.from({length:5},  () => new Bat())  : []; // Уменьшил количество мышей с 6 до 5
const eyes  = OPT.eyes ? Array.from({length:3},  () => new Eyes()) : []; // Уменьшил количество глаз с 4 до 3
const blood = OPT.blood? Array.from({length:8}, () => new Blood()): []; // Уменьшил количество капель
const embers = Array.from({length:25}, () => new Ember()); // Светлячков тоже стало чуть меньше
const spider = new Spider();

// ---------- ЦИКЛ ----------
function loop() {
  ctx.clearRect(0, 0, W, H);
  if (OPT.scene) { ctx.fillStyle = '#08000f'; ctx.fillRect(0, 0, W, H); }

  // Холодный вигнет
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.8);
  vg.addColorStop(0, 'rgba(5, 10, 20, 0)');
  vg.addColorStop(1, 'rgba(5, 10, 20, 0.6)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  if (OPT.moon) drawMoon();
  
  embers.forEach(e => { e.update(); e.draw(); });
  blood.forEach(b => { b.update(); b.draw(); });
  eyes.forEach(e  => { e.update(); e.draw();  });
  bats.forEach(b  => { b.update(); b.draw();  });
  
  spider.update(); spider.draw();

  drawLightning();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
