<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>🎃 Halloween Overlay</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden;
               width:100%; height:100%; }
  canvas { display:block; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');

// Настройки через URL
const q = new URLSearchParams(location.search);
const OPT = {
  moon:  q.get('moon')  !== '0',
  bats:  q.get('bats')  !== '0',
  blood: q.get('blood') !== '0',
  eyes:  q.get('eyes')  !== '0',
  fog:   q.get('fog')   !== '0',
  scene: q.get('scene') === '1',
  lightning: q.get('lightning') !== '0',
  spider: q.get('spider') !== '0'
};

let W, H;
function resize() {
  W = c.width  = innerWidth;
  H = c.height = innerHeight;
  c.style.width  = W + 'px';
  c.style.height = H + 'px';
}
addEventListener('resize', resize);
resize();

// ---------- НОВАЯ КРАСИВАЯ ТЫКВА (SVG) ----------
// Мы создаём SVG-картинку прямо в коде и конвертируем её в изображение
const pumpkinSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="pumpkinBody" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7b00"/>
      <stop offset="60%" stop-color="#d94800"/>
      <stop offset="100%" stop-color="#4a0a00"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Тело тыквы (сегменты) -->
  <ellipse cx="100" cy="120" rx="70" ry="60" fill="url(#pumpkinBody)" />
  <ellipse cx="60" cy="120" rx="45" ry="60" fill="url(#pumpkinBody)" />
  <ellipse cx="140" cy="120" rx="45" ry="60" fill="url(#pumpkinBody)" />
  <ellipse cx="30" cy="120" rx="25" ry="55" fill="url(#pumpkinBody)" />
  <ellipse cx="170" cy="120" rx="25" ry="55" fill="url(#pumpkinBody)" />
  
  <!-- Хвостик -->
  <path d="M 90 50 Q 90 25 100 15 Q 110 25 110 50 Z" fill="#2d4a22" />
  <path d="M 92 50 Q 95 30 100 20 Q 105 30 108 50 Z" fill="#1a2e14" />
  
  <!-- Светящееся лицо -->
  <g filter="url(#glow)" fill="#ffe600">
    <!-- Левый глаз -->
    <path d="M 45 100 L 85 80 L 80 125 Z" />
    <!-- Правый глаз -->
    <path d="M 155 100 L 115 80 L 120 125 Z" />
    <!-- Нос -->
    <path d="M 90 130 L 110 130 L 100 150 Z" />
    <!-- Рот -->
    <path d="M 45 155 Q 65 135 80 155 Q 90 140 100 155 Q 110 140 120 155 Q 135 135 155 155 L 145 185 Q 100 160 55 185 Z" />
  </g>
</svg>`;

const pumpkinImg = new Image();
pumpkinImg.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(pumpkinSvg);

function drawPumpkin() {
  if (!pumpkinImg.complete) return;
  
  const px = 30; // Отступ слева
  const py = H - 220; // Отступ снизу
  const size = 180;

  // Пульсирующее свечение вокруг тыквы
  const time = Date.now() / 600;
  const pulse = Math.sin(time) * 0.1 + 0.9; // Плавное изменение размера
  
  const g = ctx.createRadialGradient(px + size/2, py + size/2, 0, px + size/2, py + size/2, size * 1.5 * pulse);
  g.addColorStop(0, 'rgba(255, 120, 0, 0.4)');
  g.addColorStop(1, 'rgba(255, 120, 0, 0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(px + size/2, py + size/2, size * 1.5 * pulse, 0, Math.PI * 2);
  ctx.fill();

  // Сама тыква
  ctx.drawImage(pumpkinImg, px, py, size, size);
}

// ---------- МОЛНИЯ ----------
let lightningAlpha = 0;
let lightningTimer = Math.random() * 600;
function drawLightning() {
  if (!OPT.lightning) return;
  lightningTimer--;
  if (lightningTimer <= 0) {
    lightningAlpha = 0.6 + Math.random() * 0.4;
    lightningTimer = 400 + Math.random() * 800; 
  }
  if (lightningAlpha > 0) {
    ctx.fillStyle = `rgba(200, 180, 255, ${lightningAlpha})`;
    ctx.fillRect(0, 0, W, H);
    lightningAlpha -= 0.05;
    if (lightningAlpha < 0) lightningAlpha = 0;
  }
}

// ---------- ТУМАН ----------
class Fog {
  constructor() { this.respawn(); }
  respawn() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.r = 200 + Math.random() * 300;
    this.vx = (Math.random() - 0.5) * 0.4;
    this.vy = (Math.random() - 0.5) * 0.15;
    this.a  = 0.02 + Math.random() * 0.05;
    this.hue = 260 + Math.random() * 40;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    if (this.x < -this.r) this.x = W + this.r;
    if (this.x > W + this.r) this.x = -this.r;
    if (this.y < -this.r) this.y = H + this.r;
    if (this.y > H + this.r) this.y = -this.r;
  }
  draw() {
    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r);
    g.addColorStop(0, `hsla(${this.hue},85%,60%,${this.a})`);
    g.addColorStop(1, `hsla(${this.hue},85%,60%,0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
  }
}

// ---------- СВЕТЛЯЧКИ (ИСКРЫ) ----------
class Ember {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.size = 1 + Math.random() * 3;
    this.speedY = 0.2 + Math.random() * 0.8;
    this.speedX = (Math.random() - 0.5) * 0.5;
    this.alpha = 0.1 + Math.random() * 0.7;
  }
  update() {
    this.y -= this.speedY;
    this.x += this.speedX + Math.sin(this.y * 0.01) * 0.5;
    this.alpha += (Math.random() - 0.5) * 0.1;
    this.alpha = Math.max(0.1, Math.min(0.9, this.alpha));
    if (this.y < -10) this.reset();
  }
  draw() {
    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 4);
    g.addColorStop(0, `rgba(255, 100, 0, ${this.alpha})`);
    g.addColorStop(1, 'rgba(255, 50, 0, 0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 4, 0, Math.PI * 2); ctx.fill();
  }
}

// ---------- ЛЕТУЧИЕ МЫШИ ----------
class Bat {
  constructor() { this.reset(); }
  reset() {
    this.dir = Math.random() < 0.5 ? 1 : -1;
    this.x = this.dir === 1 ? -60 : W + 60;
    this.baseY = 60 + Math.random() * (H - 120);
    this.y = this.baseY;
    this.size = 10 + Math.random() * 14;
    this.speed = 1.5 + Math.random() * 2.5;
    this.t = Math.random() * 100;
    this.amp = 8 + Math.random() * 25;
  }
  update() {
    this.t += 0.1;
    this.x += this.speed * this.dir;
    this.y = this.baseY + Math.sin(this.t) * this.amp;
    if ((this.dir === 1 && this.x > W + 80) || (this.dir === -1 && this.x < -80)) this.reset();
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    if (this.dir === -1) ctx.scale(-1, 1);
    const flap = Math.sin(this.t * 2) * 0.5;
    ctx.fillStyle = 'rgba(15,0,25,0.9)';
    ctx.shadowColor = 'rgba(255,0,60,0.4)';
    ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.ellipse(0, 0, this.size * 0.28, this.size * 0.42, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, -this.size * 0.2); ctx.quadraticCurveTo(-this.size, -this.size * 0.7 - flap * this.size, -this.size * 1.5, this.size * 0.25); ctx.quadraticCurveTo(-this.size * 0.7, 0, 0, this.size * 0.1); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, -this.size * 0.2); ctx.quadraticCurveTo(this.size, -this.size * 0.7 - flap * this.size, this.size * 1.5, this.size * 0.25); ctx.quadraticCurveTo(this.size * 0.7, 0, 0, this.size * 0.1); ctx.fill();
    ctx.restore();
  }
}

// ---------- ГЛАЗА ----------
class Eyes {
  constructor() { this.respawn(true); }
  respawn(init = false) {
    this.x = 60 + Math.random() * (W - 120);
    this.y = 60 + Math.random() * (H - 120);
    this.gap  = 14 + Math.random() * 18;
    this.size = 4 + Math.random() * 7;
    this.life = 0;
    this.maxLife = 120 + Math.random() * 200;
    this.delay = init ? Math.random() * 300 : 60 + Math.random() * 400;
  }
  update() {
    if (this.delay > 0) { this.delay--; return; }
    this.life++;
    if (this.life > this.maxLife) this.respawn();
  }
  draw() {
    if (this.delay > 0 || this.life <= 0) return;
    const p = this.life / this.maxLife;
    const alpha = Math.sin(p * Math.PI);
    const blink = (Math.sin(this.life * 0.08) > 0.92) ? 0.05 : 1;
    const g1 = ctx.createRadialGradient(this.x - this.gap / 2, this.y, 0, this.x - this.gap / 2, this.y, this.size * 5);
    g1.addColorStop(0, `rgba(255,50,0,${0.55 * alpha})`); g1.addColorStop(1, 'rgba(255,50,0,0)');
    ctx.fillStyle = g1; ctx.beginPath(); ctx.arc(this.x - this.gap / 2, this.y, this.size * 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(this.x + this.gap / 2, this.y, this.size * 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(255,90,20,${alpha * blink})`;
    ctx.beginPath(); ctx.ellipse(this.x - this.gap / 2, this.y, this.size * 0.6, this.size * blink, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(this.x + this.gap / 2, this.y, this.size * 0.6, this.size * blink, 0, 0, Math.PI * 2); ctx.fill();
  }
}

// ---------- КРОВЬ ----------
class Blood {
  constructor() { this.respawn(); }
  respawn() {
    this.x = Math.random() * W; this.y = -10; this.len = 0;
    this.maxLen = 30 + Math.random() * 130; this.speed = 0.4 + Math.random() * 1.4;
    this.width = 2 + Math.random() * 3.5; this.active = false;
    this.timer = 200 + Math.random() * 800;
  }
  update() {
    if (this.timer > 0) { this.timer--; return; }
    if (!this.active) this.active = true;
    this.len += this.speed;
    if (this.len > this.maxLen) { this.width -= 0.04; if (this.width <= 0) this.respawn(); }
  }
  draw() {
    if (this.len <= 0 || this.width <= 0) return;
    const g = ctx.createLinearGradient(0, this.y, 0, this.y + this.len);
    g.addColorStop(0, 'rgba(90,0,0,0.95)'); g.addColorStop(0.6, 'rgba(160,10,10,0.85)'); g.addColorStop(1, 'rgba(120,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(this.x - this.width / 2, this.y);
    ctx.lineTo(this.x - this.width * 0.15, this.y + this.len * 0.85);
    ctx.arc(this.x, this.y + this.len * 0.85, this.width * 0.55, Math.PI, 0);
    ctx.lineTo(this.x + this.width / 2, this.y); ctx.fill();
  }
}

// ---------- ЛУНА ----------
function drawMoon() {
  const mx = W - 100, my = 100, mr = 55;
  const g = ctx.createRadialGradient(mx, my, 0, mx, my, mr * 3.5);
  g.addColorStop(0, 'rgba(255,90,20,0.35)'); g.addColorStop(0.5, 'rgba(255,40,10,0.10)'); g.addColorStop(1, 'rgba(255,40,10,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(mx, my, mr * 3.5, 0, Math.PI * 2); ctx.fill();
  const m = ctx.createRadialGradient(mx - mr * 0.3, my - mr * 0.3, mr * 0.1, mx, my, mr);
  m.addColorStop(0, '#ffaa60'); m.addColorStop(0.5, '#e85a20'); m.addColorStop(1, '#8e1a08');
  ctx.fillStyle = m; ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(70,15,5,0.28)';
  ctx.beginPath(); ctx.arc(mx - 14, my - 8, 8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + 10, my + 14, 6, 0, Math.PI * 2); ctx.fill();
}

// ---------- ПАУК ----------
class Spider {
  constructor() {
    this.x = W * 0.15; 
    this.y = -20;
    this.targetY = 150 + Math.random() * 150;
    this.state = 0; 
    this.timer = 0;
  }
  update() {
    if (!OPT.spider) return;
    if (this.state === 0) {
      this.y += 0.5;
      if (this.y >= this.targetY) { this.state = 1; this.timer = 300; }
    } else if (this.state === 1) {
      this.timer--;
      if (this.timer <= 0) this.state = 2;
    } else if (this.state === 2) {
      this.y -= 1.5;
      if (this.y < -50) {
        this.targetY = 150 + Math.random() * 200;
        this.x = W * 0.1 + Math.random() * W * 0.8;
        this.state = 0;
      }
    }
  }
  draw() {
    if (!OPT.spider) return;
    if (this.state === 2 && this.y < 0) return;
    ctx.strokeStyle = 'rgba(200,200,200,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(this.x, 0); ctx.lineTo(this.x, this.y); ctx.stroke();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.ellipse(this.x, this.y, 8, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(this.x, this.y - 10, 5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5;
    const legOffsets = [-12, -6, 6, 12];
    legOffsets.forEach(off => {
      ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.quadraticCurveTo(this.x + off*1.5, this.y - 10, this.x + off*2, this.y - 15); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.quadraticCurveTo(this.x + off*1.5, this.y + 10, this.x + off*2, this.y + 15); ctx.stroke();
    });
  }
}

// ---------- ПАУТИНА ----------
function drawCobweb(cx, cy, radius, angleStart, angleEnd) {
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 1.5;
  const rays = 5;
  for (let i = 0; i <= rays; i++) {
    const angle = angleStart + (angleEnd - angleStart) * (i / rays);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius); ctx.stroke();
  }
  for (let r = radius * 0.2; r <= radius; r += radius * 0.25) {
    ctx.beginPath();
    for (let i = 0; i <= rays; i++) {
      const angle = angleStart + (angleEnd - angleStart) * (i / rays);
      const px = cx + Math.cos(angle) * r;
      const py = cy + Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(px, py);
      else {
        const prevAngle = angleStart + (angleEnd - angleStart) * ((i - 1) / rays);
        const ctrlX = cx + Math.cos((angle + prevAngle) / 2) * r * 0.8;
        const ctrlY = cy + Math.sin((angle + prevAngle) / 2) * r * 0.8;
        ctx.quadraticCurveTo(ctrlX, ctrlY, px, py);
      }
    }
    ctx.stroke();
  }
}

// ---------- ИНИЦИАЛИЗАЦИЯ ----------
const fogs  = OPT.fog  ? Array.from({length:18}, () => new Fog())  : [];
const bats  = OPT.bats ? Array.from({length:6},  () => new Bat())  : [];
const eyes  = OPT.eyes ? Array.from({length:4},  () => new Eyes()) : [];
const blood = OPT.blood? Array.from({length:10}, () => new Blood()): [];
const embers = Array.from({length:30}, () => new Ember());
const spider = new Spider();

// ---------- ЦИКЛ ----------
function loop() {
  ctx.clearRect(0, 0, W, H);

  if (OPT.scene) {
    ctx.fillStyle = '#08000f';
    ctx.fillRect(0, 0, W, H);
  }

  // Вигнет
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.8);
  vg.addColorStop(0, 'rgba(10,0,25,0)');
  vg.addColorStop(1, 'rgba(10,0,25,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  fogs.forEach(f => { f.update(); f.draw(); });
  if (OPT.moon) drawMoon();
  embers.forEach(e => { e.update(); e.draw(); });
  blood.forEach(b => { b.update(); b.draw(); });
  
  drawPumpkin(); // Рисуем нашу новую красивую тыкву
  
  eyes.forEach(e  => { e.update(); e.draw();  });
  bats.forEach(b  => { b.update(); b.draw();  });
  
  spider.update();
  spider.draw();

  drawCobweb(0, 0, 300, 0, Math.PI / 2); 
  drawCobweb(W, 0, 300, Math.PI / 2, Math.PI); 

  drawLightning();

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
