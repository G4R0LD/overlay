<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>3D Рамка - Карамель с сахаром</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: transparent !important;
            overflow: hidden;
        }
        canvas { 
            display: block;
            filter: drop-shadow(0px 0px 15px rgba(0, 0, 0, 0.7)); 
        }
    </style>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ==========================================
// 1. СЦЕНА И КАМЕРА
// ==========================================
const scene = new THREE.Scene();

const frustumSize = 9; 
const aspect = window.innerWidth / window.innerHeight;
const camera = new THREE.OrthographicCamera(
    frustumSize * aspect / -2, frustumSize * aspect / 2, 
    frustumSize / 2, frustumSize / -2, 
    0.1, 100
);
camera.position.z = 10;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0; 
document.body.appendChild(renderer.domElement);

// ==========================================
// 2. СВЕТ (Мягкий, без выжигания)
// ==========================================
const pmremGenerator = new THREE.PMREMGenerator(renderer);
// Уменьшили яркость окружения, чтобы убрать лишний свет
const envTexture = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTexture;

// Главный свет (стал слабее)
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

// Заполняющий свет (стал слабее)
const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
fillLight.position.set(-5, -10, 5);
scene.add(fillLight);

// ==========================================
// 3. ГЕОМЕТРИЯ ТРУБКИ
// ==========================================
const W = 15.6; 
const H = 8.6; 
const cornerRadius = 0.8;
const hw = W / 2;
const hh = H / 2;

const path = new THREE.CurvePath();
path.add(new THREE.LineCurve3(new THREE.Vector3(-hw + cornerRadius, hh, 0), new THREE.Vector3(hw - cornerRadius, hh, 0)));
path.add(new THREE.QuadraticBezierCurve3(new THREE.Vector3(hw - cornerRadius, hh, 0), new THREE.Vector3(hw, hh, 0), new THREE.Vector3(hw, hh - cornerRadius, 0)));
path.add(new THREE.LineCurve3(new THREE.Vector3(hw, hh - cornerRadius, 0), new THREE.Vector3(hw, -hh + cornerRadius, 0)));
path.add(new THREE.QuadraticBezierCurve3(new THREE.Vector3(hw, -hh + cornerRadius, 0), new THREE.Vector3(hw, -hh, 0), new THREE.Vector3(hw - cornerRadius, -hh, 0)));
path.add(new THREE.LineCurve3(new THREE.Vector3(hw - cornerRadius, -hh, 0), new THREE.Vector3(-hw + cornerRadius, -hh, 0)));
path.add(new THREE.QuadraticBezierCurve3(new THREE.Vector3(-hw + cornerRadius, -hh, 0), new THREE.Vector3(-hw, -hh, 0), new THREE.Vector3(-hw, -hh + cornerRadius, 0)));
path.add(new THREE.LineCurve3(new THREE.Vector3(-hw, -hh + cornerRadius, 0), new THREE.Vector3(-hw, hh - cornerRadius, 0)));
path.add(new THREE.QuadraticBezierCurve3(new THREE.Vector3(-hw, hh - cornerRadius, 0), new THREE.Vector3(-hw, hh, 0), new THREE.Vector3(-hw + cornerRadius, hh, 0)));

const tubeRadius = 0.3; 
const geometry = new THREE.TubeGeometry(path, 600, tubeRadius, 32, true);

// ==========================================
// 4. МАТЕРИАЛ И ШЕЙДЕР (С эффектом сахара)
// ==========================================
const material = new THREE.MeshPhysicalMaterial({
    roughness: 0.4,        // Убрали сильный глянец
    metalness: 0.05, 
    clearcoat: 0.2,        // Убавили эффект лака
    clearcoatRoughness: 0.4, 
    color: 0xffffff
});

material.onBeforeCompile = (shader) => {
    shader.vertexShader = `
        varying vec2 vUv;
        ${shader.vertexShader}
    `.replace(
        '#include <begin_vertex>',
        `#include <begin_vertex>
        vUv = uv;
        
        // Формула веревки
        float freq = 80.0;
        float t = vUv.x * freq + vUv.y * 6.2831853;
        float wave = sin(t);
        float seam = smoothstep(0.3, 0.0, abs(wave));
        
        // Смещение для переплетения
        transformed += objectNormal * (0.02 * abs(wave) - 0.05 * seam);
        `
    );

    shader.fragmentShader = `
        varying vec2 vUv;
        
        // Функция генерации псевдо-случайного шума
        float hash(vec2 p) {
            p = fract(p * vec2(123.34, 456.21));
            p += dot(p, p + 45.32);
            return fract(p.x * p.y);
        }

        ${shader.fragmentShader}
    `.replace(
        '#include <map_fragment>',
        `
        // --- ЦВЕТ ---
        float freq = 80.0;
        float t = vUv.x * freq + vUv.y * 6.2831853;
        float wave = sin(t);
        float mask = smoothstep(-0.1, 0.1, wave);
        
        vec3 redColor = vec3(0.8, 0.02, 0.02);
        vec3 whiteColor = vec3(1.0, 0.98, 0.95);
        
        float ao = mix(0.5, 1.0, smoothstep(0.0, 0.35, abs(wave)));
        
        // Крупный шум для цвета (пылинки)
        float noise = hash(vUv * 100.0);
        float dirt = mix(0.9, 1.0, noise);

        vec3 finalColor = mix(redColor, whiteColor, mask) * dirt * ao;
        diffuseColor.rgb *= finalColor;
        `
    ).replace(
        '#include <roughnessmap_fragment>',
        `#include <roughnessmap_fragment>
        // --- САХАРНЫЙ ШУМ (Влияет на блик) ---
        // Чем выше значение, тем более матовым становится блик
        float sugarNoise = hash(vUv * 400.0);
        roughnessFactor += sugarNoise * 0.3; 
        `
    ).replace(
        '#include <normal_fragment_maps>',
        `#include <normal_fragment_maps>
        // --- МИКРО-БУГОРКИ (Разбивают блик на кусочки) ---
        float bumpNoise = hash(vUv * 300.0) - 0.5;
        // Слегка отклоняем нормаль, чтобы свет отражался хаотично
        normal = normalize(normal + vec3(bumpNoise * 0.1, bumpNoise * 0.1, 0.0));
        `
    );
};

const frameMesh = new THREE.Mesh(geometry, material);
scene.add(frameMesh);

// ==========================================
// 5. АНИМАЦИЯ
// ==========================================
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const time = clock.getElapsedTime();
    
    // Легкое движение для бликов
    frameMesh.rotation.x = Math.sin(time * 0.5) * 0.01;
    frameMesh.rotation.y = Math.cos(time * 0.3) * 0.01;
    
    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    const aspect = window.innerWidth / window.innerHeight;
    camera.left = -frustumSize * aspect / 2;
    camera.right = frustumSize * aspect / 2;
    camera.top = frustumSize / 2;
    camera.bottom = -frustumSize / 2;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
