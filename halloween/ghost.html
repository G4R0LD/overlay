<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>3D Призрак (Экспорт PNG)</title>
    <style>
        html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background-color: #18181b; }
        canvas { display: block; }
        
        #ui-panel {
            position: absolute; top: 20px; left: 20px;
            background: rgba(30, 30, 35, 0.95); border: 1px solid #444;
            color: white; padding: 20px; border-radius: 8px;
            font-family: 'Segoe UI', sans-serif; z-index: 100; width: 300px;
        }
        button {
            width: 100%; padding: 12px; font-size: 16px; font-weight: bold;
            color: white; background-color: #9147ff; border: none; border-radius: 5px;
            cursor: pointer; margin-bottom: 10px;
        }
        button:hover { background-color: #772ce8; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #progress { font-size: 14px; color: #00E5FF; text-align: center; }
    </style>
    <!-- Подключаем библиотеки для создания ZIP-архива и его скачивания -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
    <div id="ui-panel">
        <h3 style="margin-top: 0; text-align: center;">Экспорт кадров</h3>
        <button id="btn-export" onclick="exportFrames()">Сгенерировать ZIP с PNG</button>
        <div id="progress">Готов к работе</div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const WIDTH = 1920;
        const HEIGHT = 1080;
        
        // ВАЖНО: preserveDrawingBuffer: true необходим для сохранения PNG!
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(WIDTH, HEIGHT); 
        renderer.setClearColor(0x000000, 0); 
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, WIDTH / HEIGHT, 0.1, 1000);
        camera.position.set(0, 0, 8); 

        // Освещение
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);
        
        const screamLight = new THREE.PointLight(0xff0000, 0, 50); 
        scene.add(screamLight);

        const ghostGroup = new THREE.Group();
        scene.add(ghostGroup);

        // --- ВАШИ КООРДИНАТЫ ---
        const P_START = new THREE.Vector3(-23, -2.5, -17);
        const P_MID   = new THREE.Vector3(3.5, -4, 14.5);
        const P_END   = new THREE.Vector3(11, -4, -3);
        
        const TOTAL_FRAMES = 300; // 5 секунд при 60 FPS
        let ghostModel;
        const ghostMaterials = [];

        const loader = new GLTFLoader();

        loader.load('ghost/scene.gltf', function (gltf) {
            ghostModel = gltf.scene;
            ghostModel.traverse((child) => {
                if (child.isMesh) {
                    child.material.transparent = true;
                    child.material.depthWrite = false; 
                    if (!ghostMaterials.includes(child.material)) ghostMaterials.push(child.material);
                }
            });
            
            const box = new THREE.Box3().setFromObject(ghostModel);
            const center = box.getCenter(new THREE.Vector3());
            ghostModel.position.set(-center.x, -center.y, -center.z);
            
            const size = box.getSize(new THREE.Vector3());
            const baseScale = 5.5 / Math.max(size.x, size.y, size.z);
            ghostModel.scale.set(baseScale, baseScale, baseScale);

            ghostGroup.add(ghostModel);
            ghostMaterials.forEach(m => m.opacity = 1); // Делаем видимым для рендера
            
            // Первый пустой рендер, чтобы модель прогрузилась
            renderFrame(0);
            document.getElementById('progress').innerText = "Модель загружена. Можно экспортировать.";
        });

        // Функция математического расчета кадра (t от 0 до 1)
        function renderFrame(t) {
            // 1. Траектория (Smoothstep)
            let e = t * t * (3 - 2 * t); 
            let x = Math.pow(1 - e, 2) * P_START.x + 2 * (1 - e) * e * P_MID.x + Math.pow(e, 2) * P_END.x;
            let y = Math.pow(1 - e, 2) * P_START.y + 2 * (1 - e) * e * P_MID.y + Math.pow(e, 2) * P_END.y;
            let z = Math.pow(1 - e, 2) * P_START.z + 2 * (1 - e) * e * P_MID.z + Math.pow(e, 2) * P_END.z;

            // 2. Поворот
            let turn = Math.cos(t * Math.PI); 
            let baseYaw = Math.PI; 
            let yaw = baseYaw + turn * (Math.PI / 2); 
            let roll = turn * 0.3; 

            // 3. Свет
            let lightIntensity = Math.sin(t * Math.PI) * 25;

            // Применяем
            ghostGroup.position.set(x, y, z);
            ghostGroup.rotation.set(0, yaw, roll);

            screamLight.position.copy(ghostGroup.position);
            screamLight.position.z += 2; 
            screamLight.intensity = lightIntensity;

            renderer.render(scene, camera);
        }

        // --- ЛОГИКА ЭКСПОРТА ---
        window.exportFrames = async function() {
            if (!ghostModel) return;
            
            const btn = document.getElementById('btn-export');
            const progress = document.getElementById('progress');
            
            btn.disabled = true;
            btn.innerText = "Рендеринг...";
            
            const zip = new JSZip();
            
            for (let i = 0; i < TOTAL_FRAMES; i++) {
                let t = i / (TOTAL_FRAMES - 1);
                
                // Рендерим кадр
                renderFrame(t);
                
                // Получаем данные PNG (с прозрачностью)
                let dataUrl = renderer.domElement.toDataURL('image/png');
                // Отрезаем заголовок base64
                let base64Data = dataUrl.replace(/^data:image\/png;base64,/, "");
                
                // Имя файла: frame_0001.png
                let fileName = `frame_${String(i + 1).padStart(4, '0')}.png`;
                zip.file(fileName, base64Data, {base64: true});
                
                // Обновляем прогресс-бар в интерфейсе
                progress.innerText = `Рендер: ${i + 1} / ${TOTAL_FRAMES}`;
                
                // Даем браузеру "продохнуть" (чтобы UI не завис)
                await new Promise(r => setTimeout(r, 0));
            }

            progress.innerText = "Упаковка в ZIP...";
            
            zip.generateAsync({type:"blob"}).then(function(content) {
                saveAs(content, "ghost_frames.zip");
                progress.innerText = "Готово! ZIP скачан.";
                btn.disabled = false;
                btn.innerText = "Сгенерировать ZIP с PNG";
            });
        };
        
        // Рендер пустого экрана до загрузки
        renderer.render(scene, camera);
    </script>
</body>
</html>
