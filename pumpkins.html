<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>🎃 Pumpkin Trio Overlay</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; width:100%; height:100%; }
  canvas { display:block; pointer-events:none; }
  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: sans-serif; font-size: 20px; text-align: center; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; display: none; }
</style>
</head>
<body>
<div id="loading">Загрузка 3D-тыкв...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ 
  alpha: true, 
  antialias: true,
  premultipliedAlpha: false 
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0); 
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9; // Немного приглушили общую экспозицию
document.body.appendChild(renderer.domElement);

camera.position.z = 6.0; 

// --- НОВОЕ ОСВЕЩЕНИЕ (ГЛУБОКИЕ ТЕНИ) ---

// 1. Очень слабый общий свет (только чтобы тени не были АБСОЛЮТНО черными)
const ambientLight = new THREE.AmbientLight(0x112233, 0.6); 
scene.add(ambientLight);

// 2. Мощный холодный лунный свет СЗАДИ (Backlight)
// Светит из-за тыкв, создавая контур
const moonLight = new THREE.DirectionalLight(0x88bbff, 4.0);
moonLight.position.set(-2, 5, -5); // Сзади и слева сверху
scene.add(moonLight);

// 3. Слабый зеленовато-белый свет СПРАВА
const sideLight = new THREE.DirectionalLight(0xccffcc, 1.2);
sideLight.position.set(5, 2, 2); // Справа
scene.add(sideLight);

// --- ГРУППА ДЛЯ ТЫКВ ---
const pumpkinGroup = new THREE.Group();
scene.add(pumpkinGroup);

// --- ЗАГРУЗКА МОДЕЛИ ---
const loader = new GLTFLoader();
const loadingDiv = document.getElementById('loading');

loader.load('pumpkins_model/scene.gltf', function (gltf) {
  loadingDiv.style.display = 'none';
  const model = gltf.scene;
  
  // Центрируем и масштабируем
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  
  model.position.sub(center); 
  
  const maxDim = Math.max(size.x, size.y, size.z) || 1; 
  const targetSize = 4.5; 
  const scale = targetSize / maxDim; 
  model.scale.set(scale, scale, scale);
  
  // Настраиваем материалы (возвращаем оригинальные цвета)
  model.traverse((node) => {
    if (node.isMesh && node.material) {
      node.material.roughness = 0.9; // Сделал еще более матовым, чтобы убрать пластиковый блеск
      node.material.metalness = 0.0;
    }
  });

  pumpkinGroup.add(model); 
  
  // 4. Крошечный источник света ВНУТРИ, чтобы подсветить текстуру светящихся лиц изнутри
  // Мы убрали мощный фронтальный свет, этот работает только локально
  const innerGlow = new THREE.PointLight(0xff4400, 2.5, 2.0); // Меньше радиус, мягче свет
  innerGlow.position.set(0, 0, 1); 
  pumpkinGroup.add(innerGlow);

  pumpkinGroup.position.set(0, 0, 0); 
  pumpkinGroup.rotation.set(0, -0.6, 0); 

}, function (xhr) {
  const percent = Math.round((xhr.loaded / xhr.total) * 100);
  loadingDiv.innerHTML = `Загрузка... ${percent}%`;
}, function (error) {
  console.error("ОШИБКА:", error);
  loadingDiv.innerHTML = "ОШИБКА: Не удалось загрузить scene.gltf.";
  loadingDiv.style.color = "red";
});

// --- СТАТИЧНЫЙ РЕНДЕР ---
function render() {
  requestAnimationFrame(render);
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

render();
</script>
</body>
</html>
