<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>🎃 Pumpkin Trio Overlay</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; width:100%; height:100%; }
  canvas { display:block; pointer-events:none; }
  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: sans-serif; font-size: 20px; text-align: center; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; z-index: 100; }
</style>
</head>
<body>
<div id="loading">Загрузка 3D-тыкв...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ 
  alpha: true, 
  antialias: true,
  premultipliedAlpha: false 
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0); 
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2; 
document.body.appendChild(renderer.domElement);

// --- ОЧЕНЬ ЯРКИЙ СВЕТ ДЛЯ ТЕСТА ---
const ambientLight = new THREE.AmbientLight(0xffffff, 5.0); // Сделали очень ярким
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 3.0);
dirLight.position.set(2, 3, 4);
scene.add(dirLight);

// --- ГРУППА ДЛЯ ТЫКВ ---
const pumpkinGroup = new THREE.Group();
scene.add(pumpkinGroup);

// --- ЗАГРУЗКА МОДЕЛИ ---
const loader = new GLTFLoader();
const loadingDiv = document.getElementById('loading');

// Обрати внимание на путь
loader.load('pumpkins_model/scene.gltf', function (gltf) {
  loadingDiv.style.display = 'none';
  const model = gltf.scene;
  
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  
  // Центрируем модель
  model.position.sub(center); 
  
  // Масштабируем. Если размер 0, ставим 1.
  const maxDim = Math.max(size.x, size.y, size.z) || 1; 
  const scale = 4.0 / maxDim; 
  model.scale.set(scale, scale, scale);
  
  // ПРИНУДИТЕЛЬНО ДЕЛАЕМ МАТЕРИАЛЫ СВЕТЯЩИМИСЯ, ЧТОБЫ УВИДЕТЬ ИХ
  model.traverse((node) => {
    if (node.isMesh) {
      if (node.material) {
        // Если текстура сломалась, мы хотя бы увидим оранжевый цвет
        node.material.emissive = new THREE.Color(0xff4400);
        node.material.emissiveIntensity = 1.0;
        node.material.color = new THREE.Color(0xff8800); 
      }
    }
  });

  // Ставим ровно в центр, без смещений
  pumpkinGroup.position.set(0, 0, 0);
  pumpkinGroup.rotation.set(0, 0, 0);

  pumpkinGroup.add(model); 
  
  // Добавляем свет внутрь группы
  const pumpkinLight = new THREE.PointLight(0xffaa00, 10.0, 20.0);
  pumpkinLight.position.set(0, 2, 2); 
  pumpkinGroup.add(pumpkinLight);

  // Показываем текст об успехе прямо на экране
  loadingDiv.style.display = 'block';
  loadingDiv.innerHTML = "МОДЕЛЬ ЗАГРУЖЕНА!<br>Смотри в центр экрана.";
  setTimeout(() => { loadingDiv.style.display = 'none'; }, 3000);

}, function (xhr) {
  const percent = Math.round((xhr.loaded / xhr.total) * 100);
  loadingDiv.innerHTML = `Загрузка... ${percent}%`;
}, function (error) {
  console.error("ОШИБКА ЗАГРУЗКИ:", error);
  loadingDiv.innerHTML = "ОШИБКА: Файл не найден или битый.";
  loadingDiv.style.color = "red";
});

// --- АНИМАЦИЯ (БЕЗ ДВИЖЕНИЯ) ---
function animate() {
  requestAnimationFrame(animate);
  // Тут пусто, никакого движения
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
