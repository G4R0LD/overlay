<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>🎃 Pumpkin Trio Overlay</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; width:100%; height:100%; }
  canvas { display:block; pointer-events:none; }
  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: sans-serif; font-size: 20px; text-align: center; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; display: none; }
</style>
</head>
<body>
<div id="loading">Загрузка 3D-тыкв...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ 
  alpha: true, 
  antialias: true,
  premultipliedAlpha: false 
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0); 
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.75; 
document.body.appendChild(renderer.domElement);

camera.position.z = 6.0; 

// --- СТАТИЧНОЕ ОСВЕЩЕНИЕ ---
const ambientLight = new THREE.AmbientLight(0x112233, 0.4); 
scene.add(ambientLight);

const moonLight = new THREE.DirectionalLight(0x88bbff, 2.0);
moonLight.position.set(-2, 5, -5); 
scene.add(moonLight);

const sideLight = new THREE.DirectionalLight(0x88ccff, 0.5);
sideLight.position.set(5, 1, 2); 
scene.add(sideLight);

// --- ДИНАМИЧЕСКИЙ СВЕТ ОТ СВЕЧИ ---
const candleLight = new THREE.PointLight(0xffaa55, 25.0, 20.0);
const baseLightPos = new THREE.Vector3(-4, 2, 4); 
candleLight.position.copy(baseLightPos);
scene.add(candleLight);

// --- ГРУППА ДЛЯ ТЫКВ ---
const pumpkinGroup = new THREE.Group();
scene.add(pumpkinGroup);

// --- ЗАГРУЗКА МОДЕЛИ ---
const loader = new GLTFLoader();
const loadingDiv = document.getElementById('loading');

loader.load('pumpkins_model/scene.gltf', function (gltf) {
  loadingDiv.style.display = 'none';
  const model = gltf.scene;
  
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  
  model.position.sub(center); 
  
  const maxDim = Math.max(size.x, size.y, size.z) || 1; 
  const targetSize = 4.5; 
  const scale = targetSize / maxDim; 
  model.scale.set(scale, scale, scale);
  
  model.traverse((node) => {
    if (node.isMesh && node.material) {
      node.material.roughness = 0.9; 
      node.material.metalness = 0.0;
    }
  });

  pumpkinGroup.add(model); 
  
  pumpkinGroup.position.set(0, 0, 0); 
  pumpkinGroup.rotation.set(0, 0, 0); 

}, function (xhr) {
  const percent = Math.round((xhr.loaded / xhr.total) * 100);
  loadingDiv.innerHTML = `Загрузка... ${percent}%`;
}, function (error) {
  console.error("ОШИБКА:", error);
  loadingDiv.innerHTML = "ОШИБКА: Не удалось загрузить scene.gltf.";
  loadingDiv.style.color = "red";
});

// --- АНИМАЦИЯ СВЕТА (МЕДЛЕННЕЕ И ШИРЕ) ---
const clock = new THREE.Clock();

function render() {
  requestAnimationFrame(render);
  
  const time = clock.getElapsedTime();

  // 1. Меняем яркость (плавное "дыхание" огня)
  // Частоты снижены: 12 -> 8.5, 25 -> 17. Рандом урезан, чтобы не было стробоскопа.
  const flickerIntensity = Math.sin(time * 8.5) * 0.3 + Math.cos(time * 17) * 0.2 + Math.sin(time * 3) * 0.1;
  candleLight.intensity = 25.0 + (flickerIntensity * 15.0); 

  // 2. Движение источника света (увеличен радиус)
  // Амплитуда по X и Y увеличена с 0.1 до 0.15, по Z с 0.05 до 0.1
  candleLight.position.x = baseLightPos.x + Math.sin(time * 5.5) * 0.15;
  candleLight.position.y = baseLightPos.y + Math.cos(time * 7.0) * 0.15;
  candleLight.position.z = baseLightPos.z + Math.sin(time * 4.0) * 0.1;

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

render();
</script>
</body>
</html>
