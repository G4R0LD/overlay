<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>🎃 Pumpkin Trio Overlay</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; width:100%; height:100%; }
  canvas { display:block; pointer-events:none; }
  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: sans-serif; font-size: 20px; text-align: center; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; }
</style>
</head>
<body>
<div id="loading">Загрузка 3D-тыкв...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ 
  alpha: true, 
  antialias: true,
  premultipliedAlpha: false 
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0); 
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0; 
document.body.appendChild(renderer.domElement);

// --- ОСВЕЩЕНИЕ ---
const ambientLight = new THREE.AmbientLight(0xffffff, 2.0); 
scene.add(ambientLight);

const warmLight = new THREE.DirectionalLight(0xffaa66, 2.5);
warmLight.position.set(2, 3, 4);
scene.add(warmLight);

// --- ГРУППА ДЛЯ ТЫКВ ---
const pumpkinGroup = new THREE.Group();
scene.add(pumpkinGroup);

// --- ТЕСТОВЫЙ КРАСНЫЙ КУБ (Удалим его, когда тыквы появятся) ---
const geometry = new THREE.BoxGeometry( 1, 1, 1 );
const material = new THREE.MeshBasicMaterial( {color: 0xff0000} );
const cube = new THREE.Mesh( geometry, material );
// cube.position.set(0, 0, 0);
// scene.add( cube ); // Раскомментируй эту строчку, если хочешь проверить, работает ли сцена вообще

// --- ЗАГРУЗКА МОДЕЛИ ---
const loader = new GLTFLoader();
const loadingDiv = document.getElementById('loading');

loader.load('pumpkins_model/scene.gltf', function (gltf) {
  const model = gltf.scene;
  
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  
  // Показываем размер модели на экране (чтобы понять, не равна ли она нулю)
  loadingDiv.innerHTML = `Успех! Размер модели: <br> X: ${size.x.toFixed(2)} | Y: ${size.y.toFixed(2)} | Z: ${size.z.toFixed(2)}`;
  
  // Центрируем модель
  model.position.sub(center); 
  
  // Подгоняем размер (если размер 0, то мы делим на 0, поэтому страхуемся)
  const maxDim = Math.max(size.x, size.y, size.z) || 1; 
  const scale = 3.0 / maxDim; // Уменьшил до 3.0 для теста
  model.scale.set(scale, scale, scale);
  
  model.traverse((node) => {
    if (node.isMesh && node.material) {
      node.material.roughness = 0.8; 
      node.material.metalness = 0.1;
    }
  });

  pumpkinGroup.add(model); 
  
  // Свет внутри
  const pumpkinLight = new THREE.PointLight(0xff6600, 5.0, 10.0);
  pumpkinLight.position.set(0, 1, 1); 
  pumpkinGroup.add(pumpkinLight);

  // СТАВИМ ТЫКВЫ РОВНО В ЦЕНТР ЭКРАНА
  pumpkinGroup.position.set(0, 0, 0); 
  pumpkinGroup.rotation.y = 0; 

}, function (xhr) {
  const percent = Math.round((xhr.loaded / xhr.total) * 100);
  loadingDiv.innerHTML = `Загрузка 3D-тыкв... ${percent}%`;
}, function (error) {
  console.error(error);
  loadingDiv.innerHTML = "ОШИБКА: Не удалось загрузить scene.gltf.";
  loadingDiv.style.color = "red";
});

// --- АНИМАЦИЯ ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  // Очень легкое вращение (чтобы понять, что 3D работает)
  pumpkinGroup.rotation.y = Math.sin(time * 0.5) * 0.2;

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
