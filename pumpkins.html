<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>🎃 Pumpkin Trio Overlay</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; width:100%; height:100%; }
  canvas { display:block; pointer-events:none; }
  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: sans-serif; font-size: 20px; text-align: center; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; display: none; }
</style>
</head>
<body>
<div id="loading">Загрузка 3D-тыкв...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ 
  alpha: true, 
  antialias: true,
  premultipliedAlpha: false 
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0); 
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0; 
document.body.appendChild(renderer.domElement);

// Отодвигаем камеру
camera.position.z = 6.0; 

// --- ОСВЕЩЕНИЕ ---
const ambientLight = new THREE.AmbientLight(0xffffff, 1.5); 
scene.add(ambientLight);

const warmLight = new THREE.DirectionalLight(0xffaa66, 2.0);
warmLight.position.set(2, 3, 4);
scene.add(warmLight);

// --- ГРУППА ДЛЯ ТЫКВ ---
const pumpkinGroup = new THREE.Group();
scene.add(pumpkinGroup);

// --- ЗАГРУЗКА МОДЕЛИ ---
const loader = new GLTFLoader();
const loadingDiv = document.getElementById('loading');

loader.load('pumpkins_model/scene.gltf', function (gltf) {
  loadingDiv.style.display = 'none';
  const model = gltf.scene;
  
  // Центрируем модель
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  
  model.position.sub(center); // Сдвигаем в 0,0,0
  
  // Настраиваем размер. 4.5 - это крупный размер, который влезет в 800x800.
  const maxDim = Math.max(size.x, size.y, size.z) || 1; 
  const targetSize = 4.5; // Если надо больше - ставь 5.0, если меньше - 4.0
  const scale = targetSize / maxDim; 
  model.scale.set(scale, scale, scale);
  
  // Материалы
  model.traverse((node) => {
    if (node.isMesh && node.material) {
      node.material.roughness = 0.8; 
      node.material.metalness = 0.1;
    }
  });

  pumpkinGroup.add(model); 
  
  // Свет внутри (чтобы лица светились изнутри)
  const pumpkinLight = new THREE.PointLight(0xff6600, 5.0, 10.0);
  pumpkinLight.position.set(0, 0, 1); 
  pumpkinGroup.add(pumpkinLight);

  // Ставим ровно в центр экрана и убираем любой поворот
  pumpkinGroup.position.set(0, 0, 0); 
  pumpkinGroup.rotation.set(0, 0, 0); 

}, function (xhr) {
  const percent = Math.round((xhr.loaded / xhr.total) * 100);
  loadingDiv.innerHTML = `Загрузка... ${percent}%`;
}, function (error) {
  console.error("ОШИБКА:", error);
  loadingDiv.innerHTML = "ОШИБКА: Не удалось загрузить scene.gltf.";
  loadingDiv.style.color = "red";
});

// --- СТАТИЧНЫЙ РЕНДЕР ---
// Теперь мы просто отрисовываем кадр, никаких движений
function render() {
  requestAnimationFrame(render);
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

render();
</script>
</body>
</html>
