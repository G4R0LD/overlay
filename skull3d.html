<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>💀 3D Skull Overlay</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; width:100%; height:100%; }
  canvas { display:block; pointer-events:none; }
  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: sans-serif; font-size: 20px; text-align: center; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; display: none; }
</style>
</head>
<body>
<div id="loading">Загрузка 3D-модели...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ 
  alpha: true, 
  antialias: true,
  premultipliedAlpha: false 
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0); 
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0; 
document.body.appendChild(renderer.domElement);

// --- ОСВЕЩЕНИЕ СЦЕНЫ (Фон) ---
scene.add(new THREE.AmbientLight(0x667799, 2.5)); // Общий
const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
dirLight.position.set(2, 3, 4);
scene.add(dirLight);
const backLight = new THREE.DirectionalLight(0x4488ff, 2.5);
backLight.position.set(-2, 1, -3);
scene.add(backLight);

camera.position.z = 6.5; 

// --- СОЗДАЕМ ГРУППУ ДЛЯ ЧЕРЕПА (чтобы всё двигалось вместе) ---
const skullGroup = new THREE.Group();
scene.add(skullGroup);

// --- СВЕТ ИЗ ГЛАЗ ---
const leftEyeLight = new THREE.PointLight(0xff2200, 3.0, 1.5); 
leftEyeLight.position.set(-0.6, 0.1, 1.1); 
skullGroup.add(leftEyeLight); // Добавляем в группу!

const rightEyeLight = new THREE.PointLight(0xff2200, 3.0, 1.5);
rightEyeLight.position.set(0.6, 0.2, 1.3); 
skullGroup.add(rightEyeLight); // Добавляем в группу!

// --- ТЕКСТУРА ОГНЯ ---
function createFireTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');    
  gradient.addColorStop(0.2, 'rgba(255, 255, 150, 1)');  
  gradient.addColorStop(0.4, 'rgba(255, 100, 0, 0.8)');  
  gradient.addColorStop(0.7, 'rgba(200, 0, 0, 0.4)');    
  gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');          
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(canvas);
}

const fireMaterial = new THREE.SpriteMaterial({
  map: createFireTexture(),
  blending: THREE.AdditiveBlending, 
  depthWrite: false,
  transparent: true
});

// Спрайты огня (Добавляем в группу!)
const leftFire = new THREE.Sprite(fireMaterial.clone());
leftFire.position.set(-0.6, 0.2, 1.4);
leftFire.scale.set(0.8, 1.0, 1); 
skullGroup.add(leftFire);

const rightFire = new THREE.Sprite(fireMaterial.clone());
rightFire.position.set(0.6, 0.2, 1.4);
rightFire.scale.set(0.8, 1.0, 1);
skullGroup.add(rightFire);

// --- ИСКРЫ ИЗ ГЛАЗ ---
const eyeSparksGeo = new THREE.BufferGeometry();
const eyeSparkCount = 30;
const eyeSparkPos = new Float32Array(eyeSparkCount * 3);
const eyeSparkData = [];

for(let i = 0; i < eyeSparkCount; i++) {
  const isLeft = i % 2 === 0;
  eyeSparkData.push({ isLeft: isLeft, speed: 0.01 + Math.random() * 0.02 });
  eyeSparkPos[i*3] = isLeft ? -0.6 : 0.6;
  eyeSparkPos[i*3+1] = 0.2;
  eyeSparkPos[i*3+2] = 1.4;
}
eyeSparksGeo.setAttribute('position', new THREE.BufferAttribute(eyeSparkPos, 3));

const sparkMat = new THREE.PointsMaterial({
  color: 0xffaa00, size: 0.05, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
});
const eyeSparkSystem = new THREE.Points(eyeSparksGeo, sparkMat);
skullGroup.add(eyeSparkSystem); // Добавляем в группу!

// --- ЗАГРУЗКА МОДЕЛИ ---
const loader = new GLTFLoader();
const loadingDiv = document.getElementById('loading');
loadingDiv.style.display = 'block';

loader.load('scene.gltf', function (gltf) {
  loadingDiv.style.display = 'none';
  const model = gltf.scene;
  
  // Центрируем и масштабируем
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  model.position.sub(center); 
  
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = 3.5 / maxDim; 
  model.scale.set(scale, scale, scale);
  
  model.traverse((node) => {
    if (node.isMesh && node.material) {
      node.material.roughness = 0.9; 
      node.material.metalness = 0.0;
    }
  });

  skullGroup.add(model); // Добавляем саму модель в нашу группу
}, function (xhr) {
  const percent = Math.round((xhr.loaded / xhr.total) * 100);
  loadingDiv.innerHTML = `Загрузка 3D-модели... ${percent}%`;
}, function (error) {
  loadingDiv.innerHTML = "ОШИБКА: Не удалось загрузить scene.gltf.";
});

// --- ФОНОВЫЕ ЧАСТИЦЫ (Остаются в сцене) ---
const particleCount = 150;
const particlesGeo = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const velocities = [];
for (let i = 0; i < particleCount; i++) {
  positions[i * 3] = (Math.random() - 0.5) * 8;
  positions[i * 3 + 1] = (Math.random() - 0.5) * 8;
  positions[i * 3 + 2] = (Math.random() - 0.5) * 4;
  velocities.push({ x: (Math.random() - 0.5) * 0.01, y: Math.random() * 0.02 + 0.005, z: (Math.random() - 0.5) * 0.01 });
}
particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const sparkCanvas = document.createElement('canvas');
sparkCanvas.width = 32; sparkCanvas.height = 32;
const sCtx = sparkCanvas.getContext('2d');
const sGrad = sCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
sGrad.addColorStop(0, 'rgba(255, 200, 100, 1)'); sGrad.addColorStop(1, 'rgba(255, 0, 0, 0)');
sCtx.fillStyle = sGrad; sCtx.fillRect(0, 0, 32, 32);

const particlesMat = new THREE.PointsMaterial({
  size: 0.12, map: new THREE.CanvasTexture(sparkCanvas), transparent: true, opacity: 0.7,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const particleSystem = new THREE.Points(particlesGeo, particlesMat);
scene.add(particleSystem);

// --- АНИМАЦИЯ ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  // Анимируем ВСЮ ГРУППУ (череп + глаза + свет двигаются вместе)
  skullGroup.position.y = Math.sin(time * 1.2) * 0.1;
  skullGroup.rotation.y = Math.sin(time * 0.6) * 0.15;
  skullGroup.rotation.x = Math.cos(time * 0.8) * 0.05;

  // Мерцание огня
  const flickerL = 0.8 + Math.sin(time * 15) * 0.1 + Math.random() * 0.1;
  const flickerR = 0.8 + Math.cos(time * 12) * 0.1 + Math.random() * 0.1;
  leftFire.scale.set(flickerL * 0.8, flickerL * 1.2, 1);
  rightFire.scale.set(flickerR * 0.8, flickerR * 1.2, 1);
  leftFire.material.opacity = 0.8 + Math.random() * 0.2;
  rightFire.material.opacity = 0.8 + Math.random() * 0.2;

  // Пульсация света
  leftEyeLight.intensity = 3.0 + Math.random() * 1.5;
  rightEyeLight.intensity = 3.0 + Math.random() * 1.5;

  // Движение искр в глазах
  const ePos = eyeSparkSystem.geometry.attributes.position.array;
  for(let i = 0; i < eyeSparkCount; i++) {
    let data = eyeSparkData[i];
    ePos[i*3+1] += data.speed; 
    ePos[i*3] += Math.sin(time * 10 + i) * 0.005; 
    if(ePos[i*3+1] > 0.8) {
      ePos[i*3+1] = 0.2;
      ePos[i*3] = (data.isLeft ? -0.6 : 0.6) + (Math.random() - 0.5) * 0.1;
    }
  }
  eyeSparkSystem.geometry.attributes.position.needsUpdate = true;

  // Движение фоновых искр
  const posArray = particleSystem.geometry.attributes.position.array;
  for (let i = 0; i < particleCount; i++) {
    posArray[i * 3] += velocities[i].x;
    posArray[i * 3 + 1] += velocities[i].y;
    posArray[i * 3 + 2] += velocities[i].z;
    if (posArray[i * 3 + 1] > 4) {
      posArray[i * 3 + 1] = -4;
      posArray[i * 3] = (Math.random() - 0.5) * 8;
    }
  }
  particleSystem.geometry.attributes.position.needsUpdate = true;

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
