<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>💀 3D Skull Overlay</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; width:100%; height:100%; }
  canvas { display:block; pointer-events:none; }
  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: sans-serif; font-size: 20px; text-align: center; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; display: none; }
</style>
<!-- Используем старую версию Socket.IO (v2.0.1), совместимую с DonationAlerts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.0.1/socket.io.js"></script>
</head>
<body>
<div id="loading">Загрузка 3D-модели...</div>
<!-- Твой звук -->
<audio id="donationSound" src="sounds/skullfire.mp3" preload="auto"></audio>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ==========================================
// НАСТРОЙКИ DONATION ALERTS
// ==========================================
const DA_TOKEN = 'ТВОЙ_СЕКРЕТНЫЙ_ТОКЕН_ЗДЕСЬ'; // <-- ВСТАВЬ СЮДА СВОЙ ТОКЕН

let targetExcitement = 0; 
let currentExcitement = 0; 
let donationTimer = 0;

const sound = document.getElementById('donationSound');

function triggerEyeFlash() {
  console.log("🎬 Запускаем анимацию и звук!");
  targetExcitement = 1;
  donationTimer = 3.5; 
  if (sound) {
    sound.currentTime = 0;
    sound.play().catch(e => console.log("Браузер заблокировал звук:", e));
  }
}

// --- ПОДКЛЮЧЕНИЕ К DONATION ALERTS ---
if (DA_TOKEN && DA_TOKEN !== 'AfdrAp2zfTr2aDXE0Cdd') {
  // Подключаемся к серверу DA
  const socket = io('wss://socket.donationalerts.com/', { transports: ['websocket'] });

  socket.on('connect', () => {
    console.log('✅ Подключено к DonationAlerts!');
    socket.emit('add-user', { 
      token: DA_TOKEN, 
      type: 'alert_widget' 
    });
  });

  // 🕵️ ШПИОН для Socket.IO v2.0.1: перехватываем все входящие пакеты
  const originalOnevent = socket.onevent;
  socket.onevent = function (packet) {
    const args = packet.data || [];
    const eventName = args[0];
    const eventData = args[1];
    
    // Выводим в консоль любое событие, кроме служебных
    if (eventName !== 'connect' && eventName !== 'disconnect' && eventName !== 'error') {
      console.log('📡 [ШПИОН] Получено событие:', eventName, eventData);
    }
    
    // Вызываем оригинальный обработчик, чтобы не сломать работу других событий
    originalOnevent.call(this, packet);
  };

  socket.on('donation', (data) => {
    console.log('💥 Пришел донат! Данные:', data);
    triggerEyeFlash();
  });

  socket.on('connect_error', (err) => {
    console.error('❌ Ошибка подключения:', err.message);
  });
} else {
  console.warn('⚠️ Токен не указан или оставлен по умолчанию!');
}
// ==========================================

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, premultipliedAlpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0); 
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0; 
document.body.appendChild(renderer.domElement);

// --- ОСВЕЩЕНИЕ ---
scene.add(new THREE.AmbientLight(0x223344, 2.5)); 
const moonLight = new THREE.DirectionalLight(0x88bbff, 3.5);
moonLight.position.set(3, 5, 3); 
scene.add(moonLight);
const candleLight = new THREE.DirectionalLight(0xff8800, 2.5);
candleLight.position.set(-4, -2, -3); 
scene.add(candleLight);

camera.position.z = 6.5; 

// --- ГРУППА ЧЕРЕПА ---
const skullGroup = new THREE.Group();
scene.add(skullGroup);

// --- СВЕТ ИЗ ГЛАЗ (ЗЕЛЕНЫЙ) ---
const leftEyeLight = new THREE.PointLight(0x00ff33, 3.5, 1.0); 
leftEyeLight.position.set(-0.55, 0.2, 1.0); 
skullGroup.add(leftEyeLight);

const rightEyeLight = new THREE.PointLight(0x00ff33, 3.5, 1.0);
rightEyeLight.position.set(0.55, 0.2, 1.0); 
skullGroup.add(rightEyeLight);

// --- ТЕКСТУРА ЗЕЛЕНОГО ОГНЯ ---
function createFireTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');    
  gradient.addColorStop(0.2, 'rgba(150, 255, 150, 1)');  
  gradient.addColorStop(0.4, 'rgba(0, 255, 50, 0.8)');   
  gradient.addColorStop(0.7, 'rgba(0, 100, 0, 0.4)');    
  gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');          
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(canvas);
}

const fireMaterial = new THREE.SpriteMaterial({
  map: createFireTexture(),
  blending: THREE.AdditiveBlending, 
  depthWrite: false,
  transparent: true
});

const leftFire = new THREE.Sprite(fireMaterial.clone());
leftFire.position.set(-0.55, 0.2, 1.1);
leftFire.scale.set(0.7, 0.9, 1); 
skullGroup.add(leftFire);

const rightFire = new THREE.Sprite(fireMaterial.clone());
rightFire.position.set(0.55, 0.2, 1.1);
rightFire.scale.set(0.7, 0.9, 1);
skullGroup.add(rightFire);

// --- ИСКРЫ ИЗ ГЛАЗ (ЗЕЛЕНЫЕ) ---
const eyeSparksGeo = new THREE.BufferGeometry();
const eyeSparkCount = 30;
const eyeSparkPos = new Float32Array(eyeSparkCount * 3);
const eyeSparkData = [];

for(let i = 0; i < eyeSparkCount; i++) {
  const isLeft = i % 2 === 0;
  eyeSparkData.push({ isLeft: isLeft, speed: 0.01 + Math.random() * 0.02 });
  eyeSparkPos[i*3] = isLeft ? -0.55 : 0.55;
  eyeSparkPos[i*3+1] = 0.2;
  eyeSparkPos[i*3+2] = 1.1;
}
eyeSparksGeo.setAttribute('position', new THREE.BufferAttribute(eyeSparkPos, 3));

const sparkMat = new THREE.PointsMaterial({
  color: 0x88ff88, size: 0.05, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
});
const eyeSparkSystem = new THREE.Points(eyeSparksGeo, sparkMat);
skullGroup.add(eyeSparkSystem);

// --- ЗАГРУЗКА МОДЕЛИ ---
const loader = new GLTFLoader();
const loadingDiv = document.getElementById('loading');
loadingDiv.style.display = 'block';

loader.load('skull_model/scene.gltf', function (gltf) {
  loadingDiv.style.display = 'none';
  const model = gltf.scene;
  
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  model.position.sub(center); 
  
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = 3.5 / maxDim; 
  model.scale.set(scale, scale, scale);
  
  model.traverse((node) => {
    if (node.isMesh && node.material) {
      node.material.roughness = 0.9; 
      node.material.metalness = 0.0;
      node.material.color.multiplyScalar(0.95); 
    }
  });

  skullGroup.add(model); 
}, function (xhr) {
  const percent = Math.round((xhr.loaded / xhr.total) * 100);
  loadingDiv.innerHTML = `Загрузка 3D-модели... ${percent}%`;
}, function (error) {
  loadingDiv.innerHTML = "ОШИБКА: Не удалось загрузить scene.gltf.";
});

// --- ФОНОВЫЕ ЧАСТИЦЫ (ЗЕЛЕНЫЕ) ---
const particleCount = 150;
const particlesGeo = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const velocities = [];
for (let i = 0; i < particleCount; i++) {
  positions[i * 3] = (Math.random() - 0.5) * 8;
  positions[i * 3 + 1] = (Math.random() - 0.5) * 8;
  positions[i * 3 + 2] = (Math.random() - 0.5) * 4;
  velocities.push({ x: (Math.random() - 0.5) * 0.01, y: Math.random() * 0.02 + 0.005, z: (Math.random() - 0.5) * 0.01 });
}
particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const sparkCanvas = document.createElement('canvas');
sparkCanvas.width = 32; sparkCanvas.height = 32;
const sCtx = sparkCanvas.getContext('2d');
const sGrad = sCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
sGrad.addColorStop(0, 'rgba(200, 255, 200, 1)'); 
sGrad.addColorStop(1, 'rgba(0, 255, 0, 0)');
sCtx.fillStyle = sGrad; sCtx.fillRect(0, 0, 32, 32);

const particlesMat = new THREE.PointsMaterial({
  size: 0.12, map: new THREE.CanvasTexture(sparkCanvas), transparent: true, opacity: 0.6,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const particleSystem = new THREE.Points(particlesGeo, particlesMat);
scene.add(particleSystem);

// --- АНИМАЦИЯ ---
const clock = new THREE.Clock();
let elapsedTime = 0;

function animate() {
  requestAnimationFrame(animate);
  
  const delta = clock.getDelta(); 
  elapsedTime += delta;
  const time = elapsedTime; 

  if (donationTimer > 0) {
    donationTimer -= delta;
    if (donationTimer <= 0) {
      targetExcitement = 0; 
    }
  }

  currentExcitement += (targetExcitement - currentExcitement) * 3.0 * delta;

  let targetY = Math.sin(time * 1.2) * 0.1;
  let targetRotY = Math.sin(time * 0.6) * 0.15;
  let targetRotX = Math.cos(time * 0.8) * 0.05;
  
  let flickerL = 0.7 + Math.sin(time * 15) * 0.1 + Math.random() * 0.1;
  let flickerR = 0.7 + Math.cos(time * 12) * 0.1 + Math.random() * 0.1;
  let lightIntensityL = 3.5 + Math.random() * 1.5;
  let lightIntensityR = 3.5 + Math.random() * 1.5;
  let sparkSpeedMult = 1.0;

  if (currentExcitement > 0.01) {
    targetRotX -= 0.35 * currentExcitement;
    
    const shakeX = Math.sin(time * 60) * 0.015 * currentExcitement;
    const shakeY = Math.cos(time * 70) * 0.015 * currentExcitement;
    targetY += shakeY;
    targetRotY += shakeX;
    
    const eyePulse = 1 + currentExcitement * 1.2; 
    flickerL *= eyePulse;
    flickerR *= eyePulse;
    lightIntensityL *= (1 + currentExcitement * 1.5); 
    lightIntensityR *= (1 + currentExcitement * 1.5);
    sparkSpeedMult = 1 + currentExcitement * 2;
  }

  skullGroup.position.y = targetY;
  skullGroup.rotation.y = targetRotY;
  skullGroup.rotation.x = targetRotX;

  leftFire.scale.set(flickerL * 0.7, flickerL * 0.9, 1);
  rightFire.scale.set(flickerR * 0.7, flickerR * 0.9, 1);
  leftFire.material.opacity = 0.8 + Math.random() * 0.2;
  rightFire.material.opacity = 0.8 + Math.random() * 0.2;
  leftEyeLight.intensity = lightIntensityL;
  rightEyeLight.intensity = lightIntensityR;

  const ePos = eyeSparkSystem.geometry.attributes.position.array;
  for(let i = 0; i < eyeSparkCount; i++) {
    let data = eyeSparkData[i];
    ePos[i*3+1] += data.speed * sparkSpeedMult; 
    ePos[i*3] += Math.sin(time * 10 + i) * 0.005 * sparkSpeedMult; 
    
    if(ePos[i*3+1] > 0.8) {
      ePos[i*3+1] = 0.2;
      ePos[i*3] = (data.isLeft ? -0.55 : 0.55) + (Math.random() - 0.5) * 0.1;
    }
  }
  eyeSparkSystem.geometry.attributes.position.needsUpdate = true;

  const posArray = particleSystem.geometry.attributes.position.array;
  for (let i = 0; i < particleCount; i++) {
    posArray[i * 3] += velocities[i].x;
    posArray[i * 3 + 1] += velocities[i].y;
    posArray[i * 3 + 2] += velocities[i].z;
    if (posArray[i * 3 + 1] > 4) {
      posArray[i * 3 + 1] = -4;
      posArray[i * 3] = (Math.random() - 0.5) * 8;
    }
  }
  particleSystem.geometry.attributes.position.needsUpdate = true;

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
