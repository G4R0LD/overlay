<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>💀 3D Skull Overlay</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; width:100%; height:100%; }
  canvas { display:block; pointer-events:none; }
  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: red; font-family: sans-serif; font-size: 20px; text-align: center; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; display: none; }
</style>
</head>
<body>
<div id="loading">Загрузка 3D-модели...<br>Пожалуйста, подождите.</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// 1. Настройка сцены и рендера
const scene = new THREE.Scene();
// alpha: true делает фон прозрачным
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// 2. Освещение
const ambientLight = new THREE.AmbientLight(0x445577, 1.5); // Холодный общий свет
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 2); // Основной свет сбоку
dirLight.position.set(5, 5, 5);
scene.add(dirLight);

// Красный свет для глазниц (светит изнутри черепа)
const redLight = new THREE.PointLight(0xff0000, 25, 10);
redLight.position.set(0, 1, 1.5); // Если свет не в глазах — эту строчку будем подкручивать
scene.add(redLight);

camera.position.z = 5;

// 3. Загрузка модели GLTF
const loader = new GLTFLoader();
let skullModel = null;
const loadingDiv = document.getElementById('loading');

// Показываем плашку загрузки
loadingDiv.style.display = 'block';

// Загружаем scene.gltf (он сам подтянет scene.bin и папку textures)
loader.load('scene.gltf', function (gltf) {
  loadingDiv.style.display = 'none'; // Прячем плашку после загрузки
  
  skullModel = gltf.scene;
  
  // Автоматическое центрирование и масштабирование
  const box = new THREE.Box3().setFromObject(skullModel);
  const center = box.getCenter(new THREE.Vector3());
  skullModel.position.sub(center); // Центрируем по нулям
  
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = 3.5 / maxDim; // Делаем череп адекватного размера
  skullModel.scale.set(scale, scale, scale);
  
  // Настройка материалов и теней
  skullModel.traverse((node) => {
    if (node.isMesh) {
      node.castShadow = true;
      node.receiveShadow = true;
      // Улучшаем видимость текстур
      if (node.material) {
        node.material.envMapIntensity = 1.5;
      }
    }
  });

  scene.add(skullModel);

}, function (xhr) {
  // Прогресс загрузки (в процентах)
  const percent = Math.round((xhr.loaded / xhr.total) * 100);
  loadingDiv.innerHTML = `Загрузка 3D-модели... ${percent}%`;
}, function (error) {
  console.error("Ошибка загрузки:", error);
  loadingDiv.innerHTML = "ОШИБКА: Не удалось загрузить scene.gltf.<br>Проверь, что файлы scene.gltf, scene.bin и папка textures лежат в корне репозитория.";
});

// 4. 3D Частицы (Искры)
const particleCount = 300;
const particlesGeo = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const velocities = [];

for (let i = 0; i < particleCount; i++) {
  positions[i * 3] = (Math.random() - 0.5) * 10;
  positions[i * 3 + 1] = (Math.random() - 0.5) * 10;
  positions[i * 3 + 2] = (Math.random() - 0.5) * 5;
  velocities.push({
    x: (Math.random() - 0.5) * 0.01,
    y: Math.random() * 0.02 + 0.005,
    z: (Math.random() - 0.5) * 0.01
  });
}
particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Генерируем круглую текстуру для частиц прямо в коде
const canvas = document.createElement('canvas');
canvas.width = 16; canvas.height = 16;
const ctx = canvas.getContext('2d');
ctx.beginPath(); ctx.arc(8, 8, 8, 0, Math.PI * 2); ctx.fillStyle = 'white'; ctx.fill();
const particleTexture = new THREE.CanvasTexture(canvas);

const particlesMat = new THREE.PointsMaterial({
  color: 0xff2200,
  size: 0.15,
  map: particleTexture,
  transparent: true,
  opacity: 0.8,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const particleSystem = new THREE.Points(particlesGeo, particlesMat);
scene.add(particleSystem);

// 5. Анимация
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  if (skullModel) {
    // Левитация
    skullModel.position.y = Math.sin(time * 1.5) * 0.3;
    // Легкий поворот головы
    skullModel.rotation.y = Math.sin(time * 0.5) * 0.2;
    skullModel.rotation.x = Math.cos(time * 0.7) * 0.1;
  }

  // Движение частиц вверх
  const posArray = particleSystem.geometry.attributes.position.array;
  for (let i = 0; i < particleCount; i++) {
    posArray[i * 3] += velocities[i].x;
    posArray[i * 3 + 1] += velocities[i].y;
    posArray[i * 3 + 2] += velocities[i].z;

    if (posArray[i * 3 + 1] > 5) {
      posArray[i * 3 + 1] = -5;
      posArray[i * 3] = (Math.random() - 0.5) * 10;
    }
  }
  particleSystem.geometry.attributes.position.needsUpdate = true;
  
  // Пульсация красного света в глазницах
  redLight.intensity = 25 + Math.sin(time * 8) * 8;

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
