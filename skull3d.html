<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>💀 3D Skull Overlay</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; width:100%; height:100%; }
  canvas { display:block; pointer-events:none; }
  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: sans-serif; font-size: 20px; text-align: center; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; display: none; }
</style>
</head>
<body>
<div id="loading">Загрузка 3D-модели...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
// Камера и рендерер с настройками для ИДЕАЛЬНОЙ прозрачности
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ 
  alpha: true, 
  antialias: true,
  premultipliedAlpha: false // Важно для прозрачности в OBS
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0); // Делаем фон абсолютно прозрачным
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0; 
document.body.appendChild(renderer.domElement);

// --- ОСВЕЩЕНИЕ ---
const ambientLight = new THREE.AmbientLight(0x667799, 2.5); 
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
dirLight.position.set(2, 3, 4);
scene.add(dirLight);

const backLight = new THREE.DirectionalLight(0x4488ff, 2.5);
backLight.position.set(-2, 1, -3);
scene.add(backLight);

// Свет для глаз (он будет освещать края глазниц изнутри)
const leftEyeLight = new THREE.PointLight(0xff2200, 2.0, 1.2); 
leftEyeLight.position.set(-0.6, 0.2, 1.3); 

const rightEyeLight = new THREE.PointLight(0xff2200, 2.0, 1.2);
rightEyeLight.position.set(0.6, 0.2, 1.3); 

scene.add(leftEyeLight);
scene.add(rightEyeLight);

// --- ДОБАВЛЯЕМ ВИЗУАЛЬНОЕ СВЕЧЕНИЕ В ГЛАЗА (Вместо Bloom) ---
// Создаем мягкую текстуру свечения
const glowCanvas = document.createElement('canvas');
glowCanvas.width = 64; glowCanvas.height = 64;
const gCtx = glowCanvas.getContext('2d');
const gradient = gCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
gradient.addColorStop(0, 'rgba(255, 0, 0, 1)');
gradient.addColorStop(0.2, 'rgba(255, 0, 0, 0.8)');
gradient.addColorStop(0.5, 'rgba(255, 0, 0, 0.3)');
gradient.addColorStop(1, 'rgba(255, 0, 0, 0)');
gCtx.fillStyle = gradient;
gCtx.fillRect(0, 0, 64, 64);
const glowTexture = new THREE.CanvasTexture(glowCanvas);

// Делаем два светящихся "шарика" в глазах
const eyeGlowMaterial = new THREE.SpriteMaterial({ 
  map: glowTexture, 
  color: 0xff2200, 
  blending: THREE.AdditiveBlending, 
  depthWrite: false,
  transparent: true
});

const leftEyeGlow = new THREE.Sprite(eyeGlowMaterial);
leftEyeGlow.position.set(-0.6, 0.2, 1.4); // Чуть впереди света
leftEyeGlow.scale.set(0.8, 0.8, 1);

const rightEyeGlow = new THREE.Sprite(eyeGlowMaterial);
rightEyeGlow.position.set(0.6, 0.2, 1.4);
rightEyeGlow.scale.set(0.8, 0.8, 1);

scene.add(leftEyeGlow);
scene.add(rightEyeGlow);

camera.position.z = 6.5; 

// --- ЗАГРУЗКА МОДЕЛИ ---
const loader = new GLTFLoader();
let skullModel = null;
const loadingDiv = document.getElementById('loading');
loadingDiv.style.display = 'block';

loader.load('scene.gltf', function (gltf) {
  loadingDiv.style.display = 'none';
  skullModel = gltf.scene;
  
  const box = new THREE.Box3().setFromObject(skullModel);
  const center = box.getCenter(new THREE.Vector3());
  skullModel.position.sub(center); 
  
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = 3.5 / maxDim; 
  skullModel.scale.set(scale, scale, scale);
  
  skullModel.traverse((node) => {
    if (node.isMesh) {
      if (node.material) {
        node.material.roughness = 0.9; 
        node.material.metalness = 0.0;
      }
    }
  });

  scene.add(skullModel);
}, function (xhr) {
  const percent = Math.round((xhr.loaded / xhr.total) * 100);
  loadingDiv.innerHTML = `Загрузка 3D-модели... ${percent}%`;
}, function (error) {
  loadingDiv.innerHTML = "ОШИБКА: Не удалось загрузить scene.gltf.";
});

// --- ЧАСТИЦЫ (Круглые искры) ---
const particleCount = 200;
const particlesGeo = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const velocities = [];

for (let i = 0; i < particleCount; i++) {
  positions[i * 3] = (Math.random() - 0.5) * 8;
  positions[i * 3 + 1] = (Math.random() - 0.5) * 8;
  positions[i * 3 + 2] = (Math.random() - 0.5) * 4;
  velocities.push({
    x: (Math.random() - 0.5) * 0.01,
    y: Math.random() * 0.02 + 0.005,
    z: (Math.random() - 0.5) * 0.01
  });
}
particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Текстура для искр (мягкий круг)
const sparkCanvas = document.createElement('canvas');
sparkCanvas.width = 32; sparkCanvas.height = 32;
const sCtx = sparkCanvas.getContext('2d');
const sGrad = sCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
sGrad.addColorStop(0, 'rgba(255, 200, 100, 1)');
sGrad.addColorStop(0.5, 'rgba(255, 100, 0, 0.8)');
sGrad.addColorStop(1, 'rgba(255, 0, 0, 0)');
sCtx.fillStyle = sGrad;
sCtx.fillRect(0, 0, 32, 32);
const sparkTexture = new THREE.CanvasTexture(sparkCanvas);

const particlesMat = new THREE.PointsMaterial({
  size: 0.15,
  map: sparkTexture,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const particleSystem = new THREE.Points(particlesGeo, particlesMat);
scene.add(particleSystem);

// --- АНИМАЦИЯ ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  if (skullModel) {
    skullModel.position.y = Math.sin(time * 1.2) * 0.1;
    skullModel.rotation.y = Math.sin(time * 0.6) * 0.15;
    skullModel.rotation.x = Math.cos(time * 0.8) * 0.05;
  }

  // Пульсация света и свечения в глазах
  const pulse = 1.5 + Math.sin(time * 4) * 0.5; 
  leftEyeLight.intensity = pulse;
  rightEyeLight.intensity = pulse;
  
  // Пульсирующий размер светящихся шариков
  const glowScale = 0.8 + Math.sin(time * 4) * 0.1;
  leftEyeGlow.scale.set(glowScale, glowScale, 1);
  rightEyeGlow.scale.set(glowScale, glowScale, 1);

  const posArray = particleSystem.geometry.attributes.position.array;
  for (let i = 0; i < particleCount; i++) {
    posArray[i * 3] += velocities[i].x;
    posArray[i * 3 + 1] += velocities[i].y;
    posArray[i * 3 + 2] += velocities[i].z;

    if (posArray[i * 3 + 1] > 4) {
      posArray[i * 3 + 1] = -4;
      posArray[i * 3] = (Math.random() - 0.5) * 8;
    }
  }
  particleSystem.geometry.attributes.position.needsUpdate = true;

  // Обычный рендер, без композера. Прозрачность будет идеальной.
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
