<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>💀 3D Skull Overlay</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; width:100%; height:100%; }
  canvas { display:block; pointer-events:none; }
  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: red; font-family: sans-serif; font-size: 20px; text-align: center; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; display: none; }
</style>
</head>
<body>
<div id="loading">Загрузка 3D-модели...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0; // Чуть приглушили общую яркость
document.body.appendChild(renderer.domElement);

// --- ОСВЕЩЕНИЕ ---
// 1. Общий холодный фоновый свет (чтобы череп не был черным)
const ambientLight = new THREE.AmbientLight(0x334455, 1.2); 
scene.add(ambientLight);

// 2. Свет спереди-слева (как будто от твоих свечей)
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(2, 3, 4);
scene.add(dirLight);

// 3. Синий свет сзади (для крутого контрового света)
const backLight = new THREE.DirectionalLight(0x4488ff, 2);
backLight.position.set(-2, 1, -3);
scene.add(backLight);

// 4. ДВА ТОЧЕЧНЫХ СВЕТА ДЛЯ ГЛАЗ (Адское свечение)
const leftEyeLight = new THREE.PointLight(0xff2200, 4, 2.5); // Яркость 4, радиус действия 2.5
leftEyeLight.position.set(-0.6, 0.2, 1.6); // Координаты левого глаза

const rightEyeLight = new THREE.PointLight(0xff2200, 4, 2.5);
rightEyeLight.position.set(0.3, 0.4, 1.6); // Координаты правого глаза

scene.add(leftEyeLight);
scene.add(rightEyeLight);

camera.position.z = 6.5; // Отодвинули камеру, чтобы череп не обрезался при левитации

// --- ЗАГРУЗКА МОДЕЛИ ---
const loader = new GLTFLoader();
let skullModel = null;
const loadingDiv = document.getElementById('loading');
loadingDiv.style.display = 'block';

loader.load('scene.gltf', function (gltf) {
  loadingDiv.style.display = 'none';
  skullModel = gltf.scene;
  
  const box = new THREE.Box3().setFromObject(skullModel);
  const center = box.getCenter(new THREE.Vector3());
  skullModel.position.sub(center); 
  
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = 3.5 / maxDim; 
  skullModel.scale.set(scale, scale, scale);
  
  skullModel.traverse((node) => {
    if (node.isMesh) {
      // Делаем материал чуть темнее, чтобы модель не бликовала белым
      if (node.material) {
        node.material.roughness = 0.8; 
        node.material.metalness = 0.1;
      }
    }
  });

  scene.add(skullModel);
}, function (xhr) {
  const percent = Math.round((xhr.loaded / xhr.total) * 100);
  loadingDiv.innerHTML = `Загрузка 3D-модели... ${percent}%`;
}, function (error) {
  loadingDiv.innerHTML = "ОШИБКА: Не удалось загрузить scene.gltf.";
});

// --- ЧАСТИЦЫ (Искры) ---
const particleCount = 200;
const particlesGeo = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const velocities = [];

for (let i = 0; i < particleCount; i++) {
  positions[i * 3] = (Math.random() - 0.5) * 8;
  positions[i * 3 + 1] = (Math.random() - 0.5) * 8;
  positions[i * 3 + 2] = (Math.random() - 0.5) * 4;
  velocities.push({
    x: (Math.random() - 0.5) * 0.01,
    y: Math.random() * 0.02 + 0.005,
    z: (Math.random() - 0.5) * 0.01
  });
}
particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const canvas = document.createElement('canvas');
canvas.width = 16; canvas.height = 16;
const ctx = canvas.getContext('2d');
ctx.beginPath(); ctx.arc(8, 8, 8, 0, Math.PI * 2); ctx.fillStyle = 'white'; ctx.fill();
const particleTexture = new THREE.CanvasTexture(canvas);

const particlesMat = new THREE.PointsMaterial({
  color: 0xff3300,
  size: 0.1,
  map: particleTexture,
  transparent: true,
  opacity: 0.6,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const particleSystem = new THREE.Points(particlesGeo, particlesMat);
scene.add(particleSystem);

// --- АНИМАЦИЯ ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  if (skullModel) {
    // ОЧЕНЬ плавная левитация (амплитуда всего 0.1 вместо 0.3)
    skullModel.position.y = Math.sin(time * 1.2) * 0.1;
    
    // Легкий, медленный поворот
    skullModel.rotation.y = Math.sin(time * 0.6) * 0.15;
    skullModel.rotation.x = Math.cos(time * 0.8) * 0.05;
  }

  // Пульсация света в глазах
  const pulse = 3 + Math.sin(time * 6) * 2; // Меняется от 1 до 5
  leftEyeLight.intensity = pulse;
  rightEyeLight.intensity = pulse;

  // Движение искр
  const posArray = particleSystem.geometry.attributes.position.array;
  for (let i = 0; i < particleCount; i++) {
    posArray[i * 3] += velocities[i].x;
    posArray[i * 3 + 1] += velocities[i].y;
    posArray[i * 3 + 2] += velocities[i].z;

    if (posArray[i * 3 + 1] > 4) {
      posArray[i * 3 + 1] = -4;
      posArray[i * 3] = (Math.random() - 0.5) * 8;
    }
  }
  particleSystem.geometry.attributes.position.needsUpdate = true;

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
