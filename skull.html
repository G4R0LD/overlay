<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>💀 Code Skull</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden;
               width:100%; height:100%; display: flex; justify-content: center; align-items: center; }
  canvas { display:block; pointer-events:none; position: absolute; top: 0; left: 0; }
  .skull-container {
    position: relative;
    width: 400px;
    height: 400px;
    animation: float 4s ease-in-out infinite;
    z-index: 2;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(2deg); }
  }
  .jaw {
    transform-origin: 100px 140px;
    animation: chew 6s ease-in-out infinite;
  }
  @keyframes chew {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(12deg); }
  }
  .eye-glow {
    animation: pulse 2s infinite alternate;
  }
  @keyframes pulse {
    0% { opacity: 0.6; filter: drop-shadow(0 0 10px #ff0000); }
    100% { opacity: 1; filter: drop-shadow(0 0 30px #ff0000); }
  }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="skull-container">
  <svg viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
      <linearGradient id="bone" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#e6e6e6"/>
        <stop offset="50%" stop-color="#999999"/>
        <stop offset="100%" stop-color="#4d4d4d"/>
      </linearGradient>
      <linearGradient id="shadow" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0.8)"/>
      </linearGradient>
      <radialGradient id="eye" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff"/>
        <stop offset="30%" stop-color="#ff0000"/>
        <stop offset="100%" stop-color="rgba(255,0,0,0)"/>
      </radialGradient>
    </defs>

    <!-- Основная часть черепа (сверху) -->
    <path d="M 40 100 C 30 40, 80 10, 100 10 C 120 10, 170 40, 160 100 C 155 120, 140 130, 130 130 L 70 130 C 60 130, 45 120, 40 100 Z" fill="url(#bone)" stroke="#222" stroke-width="2"/>
    
    <!-- Скулы -->
    <path d="M 40 100 C 45 115, 60 120, 65 125 L 60 115 Z" fill="#666"/>
    <path d="M 160 100 C 155 115, 140 120, 135 125 L 140 115 Z" fill="#666"/>

    <!-- Глазницы -->
    <path d="M 55 80 C 55 60, 85 60, 85 80 C 85 95, 70 100, 55 80 Z" fill="#000" stroke="#333" stroke-width="2"/>
    <path d="M 145 80 C 145 60, 115 60, 115 80 C 115 95, 130 100, 145 80 Z" fill="#000" stroke="#333" stroke-width="2"/>

    <!-- Свечение в глазах -->
    <circle class="eye-glow" cx="70" cy="80" r="12" fill="url(#eye)" />
    <circle class="eye-glow" cx="130" cy="80" r="12" fill="url(#eye)" />

    <!-- Нос -->
    <path d="M 100 90 L 90 115 L 110 115 Z" fill="#000" stroke="#333" stroke-width="2"/>

    <!-- Верхние зубы -->
    <path d="M 70 130 L 130 130 L 125 145 L 75 145 Z" fill="#aaa" stroke="#222" stroke-width="1"/>
    <path d="M 75 130 L 80 145 M 85 130 L 90 145 M 95 130 L 95 145 M 105 130 L 105 145 M 115 130 L 110 145 M 125 130 L 120 145" stroke="#222" stroke-width="1"/>

    <!-- Нижняя челюсть (анимированная) -->
    <g class="jaw">
      <path d="M 65 145 C 65 170, 135 170, 135 145 L 125 155 C 110 165, 90 165, 75 155 Z" fill="url(#bone)" stroke="#222" stroke-width="2"/>
      <!-- Нижние зубы -->
      <path d="M 75 148 L 125 148 L 120 155 L 80 155 Z" fill="#aaa" stroke="#222" stroke-width="1"/>
      <path d="M 80 148 L 80 155 M 90 148 L 90 155 M 100 148 L 100 155 M 110 148 L 110 155 M 120 148 L 120 155" stroke="#222" stroke-width="1"/>
    </g>
    
    <!-- Тени для объема -->
    <path d="M 40 100 C 30 40, 80 10, 100 10 C 120 10, 170 40, 160 100 C 155 120, 140 130, 130 130 L 70 130 C 60 130, 45 120, 40 100 Z" fill="url(#shadow)" opacity="0.3"/>
  </svg>
</div>

<script>
// --- Система частиц (адские искры из глаз) ---
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

class Particle {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 2;
    this.vy = (Math.random() - 1) * 3 - 1; // Летят вверх
    this.size = Math.random() * 3 + 1;
    this.life = 1.0;
    this.decay = Math.random() * 0.02 + 0.01;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }
  draw() {
    if (this.life <= 0) return;
    ctx.fillStyle = `rgba(255, ${Math.random() * 100}, 0, ${this.life})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

let particles = [];

function animate() {
  ctx.clearRect(0, 0, W, H);
  
  // Центр экрана (где находится череп)
  const cx = W / 2;
  const cy = H / 2;
  
  // Координаты глаз относительно центра (подогнано под SVG)
  const eyeOffsetX = 60; // (130 - 70) / 2
  const eyeOffsetY = -40; // (80 - 100)
  
  // Спавним частицы из глаз
  if (Math.random() < 0.3) {
    particles.push(new Particle(cx - eyeOffsetX + (Math.random()-0.5)*10, cy + eyeOffsetY + (Math.random()-0.5)*10));
  }
  if (Math.random() < 0.3) {
    particles.push(new Particle(cx + eyeOffsetX + (Math.random()-0.5)*10, cy + eyeOffsetY + (Math.random()-0.5)*10));
  }

  particles.forEach((p, index) => {
    p.update();
    p.draw();
    if (p.life <= 0) particles.splice(index, 1);
  });

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
