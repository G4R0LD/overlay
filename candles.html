<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>🕯️ Realistic Candles</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden;
               width:100%; height:100%; display: flex; justify-content: center; align-items: flex-end; }
  canvas { display:block; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');

let W, H;
function resize() {
  W = c.width  = innerWidth;
  H = c.height = innerHeight;
  c.style.width  = W + 'px';
  c.style.height = H + 'px';
}
addEventListener('resize', resize);
resize();

class CandleGroup {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.time = Math.random() * 100;
  }
  
  update() {
    this.time += 0.05;
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);

    // 1. ОБЩЕЕ СВЕЧЕНИЕ ОТ ГРУППЫ СВЕЧЕЙ
    const groupGlow = ctx.createRadialGradient(0, -80, 0, 0, -80, 350);
    groupGlow.addColorStop(0, 'rgba(255, 160, 60, 0.25)');
    groupGlow.addColorStop(0.4, 'rgba(255, 100, 0, 0.1)');
    groupGlow.addColorStop(1, 'rgba(255, 50, 0, 0)');
    ctx.fillStyle = groupGlow;
    ctx.beginPath();
    ctx.arc(0, -80, 350, 0, Math.PI * 2);
    ctx.fill();

    // 2. УЛУЧШЕННАЯ ЛУЖА ВОСКА (Неровная, многослойная)
    // Тень под лужей
    ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
    ctx.beginPath();
    ctx.ellipse(0, 10, 140, 40, 0, 0, Math.PI * 2);
    ctx.fill();

    // Основная лужа (сложная форма)
    const puddleGrad = ctx.createLinearGradient(-100, 0, 100, 0);
    puddleGrad.addColorStop(0, 'rgba(180, 170, 150, 0.9)');
    puddleGrad.addColorStop(0.5, 'rgba(245, 240, 225, 0.95)');
    puddleGrad.addColorStop(1, 'rgba(180, 170, 150, 0.9)');
    
    ctx.fillStyle = puddleGrad;
    ctx.beginPath();
    ctx.moveTo(-110, 0);
    ctx.bezierCurveTo(-150, 15, -100, 45, -20, 45);
    ctx.bezierCurveTo(60, 45, 140, 30, 130, 5);
    ctx.bezierCurveTo(120, -15, 80, -20, 20, -20);
    ctx.bezierCurveTo(-40, -20, -70, -15, -110, 0);
    ctx.fill();

    // Блики на луже
    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.beginPath();
    ctx.ellipse(-40, 10, 40, 10, 0.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(50, 15, 25, 8, -0.1, 0, Math.PI * 2);
    ctx.fill();

    // Мелкие капли воска вокруг
    const drops = [[-130, 25, 10], [140, 10, 8], [80, 40, 12], [-90, 40, 15]];
    drops.forEach(d => {
      ctx.fillStyle = 'rgba(230, 225, 210, 0.8)';
      ctx.beginPath(); ctx.ellipse(d[0], d[1], d[2], d[2]*0.6, 0, 0, Math.PI * 2); ctx.fill();
    });

    // 3. СВЕЧИ (Плотно прилегают друг к другу)
    // Задний ряд
    this.drawCandle(-25, -30, 60, 120, this.time);
    this.drawCandle(35, -25, 50, 90, this.time + 1.5);
    
    // Средний ряд
    this.drawCandle(-70, -15, 55, 80, this.time + 3);
    this.drawCandle(0, -10, 70, 140, this.time + 2);
    this.drawCandle(65, -15, 45, 70, this.time + 4);

    // Передний ряд (маленькие огарки)
    this.drawCandle(-95, 0, 40, 45, this.time + 5);
    this.drawCandle(-45, 0, 50, 55, this.time + 1);
    this.drawCandle(40, 0, 45, 50, this.time + 6);
    this.drawCandle(85, 0, 35, 35, this.time + 2.5);

    ctx.restore();
  }

  drawCandle(cx, cy, w, h, timeOffset) {
    ctx.save();
    ctx.translate(cx, cy);

    // Тень от свечи (чтобы отделить их друг от друга)
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.ellipse(0, 0, w/1.5, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // Тело свечи
    const bodyGrad = ctx.createLinearGradient(-w/2, 0, w/2, 0);
    bodyGrad.addColorStop(0, 'rgba(200, 195, 180, 0.98)'); 
    bodyGrad.addColorStop(0.3, 'rgba(255, 250, 235, 0.98)'); 
    bodyGrad.addColorStop(0.7, 'rgba(240, 230, 210, 0.98)'); 
    bodyGrad.addColorStop(1, 'rgba(180, 170, 150, 0.98)'); 

    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.moveTo(-w/2, 0);
    ctx.lineTo(-w/2, -h + 10);
    ctx.bezierCurveTo(-w/2, -h, -w/4, -h - 15, 0, -h);
    ctx.bezierCurveTo(w/4, -h + 5, w/2, -h - 5, w/2, -h + 10);
    ctx.lineTo(w/2, 0);
    ctx.fill();

    // Стекающий воск
    ctx.fillStyle = 'rgba(255, 250, 240, 0.9)';
    ctx.beginPath();
    ctx.moveTo(-w/3, -h + 15);
    ctx.quadraticCurveTo(-w/2, -h/2, -w/3 + 5, 0);
    ctx.lineTo(-w/3 - 5, 0);
    ctx.quadraticCurveTo(-w/2 - 5, -h/2, -w/3, -h + 15);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(w/4, -h + 10);
    ctx.quadraticCurveTo(w/3, -h/4, w/4 + 5, -5);
    ctx.lineTo(w/4 - 5, -5);
    ctx.quadraticCurveTo(w/3 - 10, -h/4, w/4, -h + 10);
    ctx.fill();

    // Внутреннее свечение воска
    const innerGlow = ctx.createRadialGradient(0, -h + 20, 0, 0, -h + 20, h * 0.8);
    innerGlow.addColorStop(0, 'rgba(255, 180, 50, 0.35)');
    innerGlow.addColorStop(1, 'rgba(255, 180, 50, 0)');
    ctx.fillStyle = innerGlow;
    ctx.beginPath();
    ctx.ellipse(0, -h/2, w/2, h/2, 0, 0, Math.PI * 2);
    ctx.fill();

    // Огонь и фитиль
    const flameH = 30 + Math.sin(timeOffset) * 5 + Math.cos(timeOffset * 3) * 2;
    
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -h); ctx.lineTo(0, -h - 5); ctx.stroke();

    const flameGlow = ctx.createRadialGradient(0, -h - flameH/2, 0, 0, -h - flameH/2, 40);
    flameGlow.addColorStop(0, 'rgba(255, 150, 50, 0.7)');
    flameGlow.addColorStop(1, 'rgba(255, 100, 0, 0)');
    ctx.fillStyle = flameGlow;
    ctx.beginPath(); ctx.arc(0, -h - flameH/2, 40, 0, Math.PI * 2); ctx.fill();

    ctx.globalCompositeOperation = 'lighter'; 
    
    ctx.fillStyle = 'rgba(255, 100, 0, 0.8)';
    ctx.beginPath(); ctx.moveTo(0, -h - flameH);
    ctx.quadraticCurveTo(10 + Math.sin(timeOffset*2)*2, -h - flameH/2, 0, -h);
    ctx.quadraticCurveTo(-10 + Math.sin(timeOffset*2)*2, -h - flameH/2, 0, -h - flameH); ctx.fill();

    ctx.fillStyle = 'rgba(255, 220, 100, 0.9)';
    ctx.beginPath(); ctx.moveTo(0, -h - flameH + 5);
    ctx.quadraticCurveTo(5, -h - flameH/2, 0, -h);
    ctx.quadraticCurveTo(-5, -h - flameH/2, 0, -h - flameH + 5); ctx.fill();

    ctx.fillStyle = 'rgba(255, 255, 255, 1)';
    ctx.beginPath(); ctx.moveTo(0, -h - flameH + 10);
    ctx.quadraticCurveTo(3, -h - flameH/2, 0, -h);
    ctx.quadraticCurveTo(-3, -h - flameH/2, 0, -h - flameH + 10); ctx.fill();

    ctx.restore();
  }
}

// Ставим свечи по центру экрана (чуть ниже середины)
const candles = new CandleGroup(W / 2, H / 2 + 100);

function loop() {
  ctx.clearRect(0, 0, W, H);
  candles.update();
  candles.draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
