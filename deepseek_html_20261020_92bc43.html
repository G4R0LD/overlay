<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>🎃 Halloween Overlay</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden;
               width:100%; height:100%; }
  canvas { display:block; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');

// ---- настройки через URL: ?moon=0&bats=0&blood=0&eyes=0&fog=0&scene=1
const q = new URLSearchParams(location.search);
const OPT = {
  moon:  q.get('moon')  !== '0',
  bats:  q.get('bats')  !== '0',
  blood: q.get('blood') !== '0',
  eyes:  q.get('eyes')  !== '0',
  fog:   q.get('fog')   !== '0',
  scene: q.get('scene') === '1',   // тёмный фон, если открываешь в браузере
};

let W, H;
function resize() {
  W = c.width  = innerWidth;
  H = c.height = innerHeight;
  c.style.width  = W + 'px';
  c.style.height = H + 'px';
}
addEventListener('resize', resize);
resize();

// ---------- ТУМАН ----------
class Fog {
  constructor() { this.respawn(); }
  respawn() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.r = 150 + Math.random() * 280;
    this.vx = (Math.random() - 0.5) * 0.4;
    this.vy = (Math.random() - 0.5) * 0.15;
    this.a  = 0.02 + Math.random() * 0.05;
    this.hue = 260 + Math.random() * 40;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    if (this.x < -this.r) this.x = W + this.r;
    if (this.x > W + this.r) this.x = -this.r;
    if (this.y < -this.r) this.y = H + this.r;
    if (this.y > H + this.r) this.y = -this.r;
  }
  draw() {
    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r);
    g.addColorStop(0, `hsla(${this.hue},85%,60%,${this.a})`);
    g.addColorStop(1, `hsla(${this.hue},85%,60%,0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
  }
}

// ---------- ЛЕТУЧИЕ МЫШИ ----------
class Bat {
  constructor() { this.reset(); }
  reset() {
    this.dir = Math.random() < 0.5 ? 1 : -1;
    this.x = this.dir === 1 ? -60 : W + 60;
    this.baseY = 60 + Math.random() * (H - 120);
    this.y = this.baseY;
    this.size = 10 + Math.random() * 14;
    this.speed = 1 + Math.random() * 2;
    this.t = Math.random() * 100;
    this.amp = 8 + Math.random() * 25;
  }
  update() {
    this.t += 0.1;
    this.x += this.speed * this.dir;
    this.y = this.baseY + Math.sin(this.t) * this.amp;
    if ((this.dir === 1 && this.x > W + 80) ||
        (this.dir === -1 && this.x < -80)) this.reset();
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    if (this.dir === -1) ctx.scale(-1, 1);
    const flap = Math.sin(this.t * 2) * 0.5;
    ctx.fillStyle = 'rgba(15,0,25,0.88)';
    ctx.shadowColor = 'rgba(255,0,60,0.35)';
    ctx.shadowBlur = 10;
    // тело
    ctx.beginPath();
    ctx.ellipse(0, 0, this.size * 0.28, this.size * 0.42, 0, 0, Math.PI * 2);
    ctx.fill();
    // левое крыло
    ctx.beginPath();
    ctx.moveTo(0, -this.size * 0.2);
    ctx.quadraticCurveTo(-this.size, -this.size * 0.7 - flap * this.size,
                         -this.size * 1.5, this.size * 0.25);
    ctx.quadraticCurveTo(-this.size * 0.7, 0, 0, this.size * 0.1);
    ctx.fill();
    // правое крыло
    ctx.beginPath();
    ctx.moveTo(0, -this.size * 0.2);
    ctx.quadraticCurveTo(this.size, -this.size * 0.7 - flap * this.size,
                         this.size * 1.5, this.size * 0.25);
    ctx.quadraticCurveTo(this.size * 0.7, 0, 0, this.size * 0.1);
    ctx.fill();
    ctx.restore();
  }
}

// ---------- ГЛАЗА В ТЕМНОТЕ ----------
class Eyes {
  constructor() { this.respawn(true); }
  respawn(init = false) {
    this.x = 60 + Math.random() * (W - 120);
    this.y = 60 + Math.random() * (H - 120);
    this.gap  = 14 + Math.random() * 18;
    this.size = 4 + Math.random() * 7;
    this.life = 0;
    this.maxLife = 120 + Math.random() * 200;
    this.delay = init ? Math.random() * 300 : 60 + Math.random() * 400;
  }
  update() {
    if (this.delay > 0) { this.delay--; return; }
    this.life++;
    if (this.life > this.maxLife) this.respawn();
  }
  draw() {
    if (this.delay > 0 || this.life <= 0) return;
    const p = this.life / this.maxLife;
    const alpha = Math.sin(p * Math.PI);
    const blink = (Math.sin(this.life * 0.08) > 0.92) ? 0.05 : 1;

    // свечение
    const g1 = ctx.createRadialGradient(
      this.x - this.gap / 2, this.y, 0,
      this.x - this.gap / 2, this.y, this.size * 5);
    g1.addColorStop(0, `rgba(255,50,0,${0.55 * alpha})`);
    g1.addColorStop(1, 'rgba(255,50,0,0)');
    ctx.fillStyle = g1;
    ctx.beginPath();
    ctx.arc(this.x - this.gap / 2, this.y, this.size * 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.arc(this.x + this.gap / 2, this.y, this.size * 5, 0, Math.PI * 2); ctx.fill();

    // сами глаза
    ctx.fillStyle = `rgba(255,90,20,${alpha * blink})`;
    ctx.beginPath();
    ctx.ellipse(this.x - this.gap / 2, this.y, this.size * 0.6,
                this.size * blink, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(this.x + this.gap / 2, this.y, this.size * 0.6,
                this.size * blink, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---------- КРОВЬ СВЕРХУ ----------
class Blood {
  constructor() { this.respawn(); }
  respawn() {
    this.x = Math.random() * W;
    this.y = -10;
    this.len = 0;
    this.maxLen = 30 + Math.random() * 130;
    this.speed = 0.4 + Math.random() * 1.4;
    this.width = 2 + Math.random() * 3.5;
    this.active = false;
    this.timer = 200 + Math.random() * 800;
  }
  update() {
    if (this.timer > 0) { this.timer--; return; }
    if (!this.active) this.active = true;
    this.len += this.speed;
    if (this.len > this.maxLen) {
      this.width -= 0.04;
      if (this.width <= 0) this.respawn();
    }
  }
  draw() {
    if (this.len <= 0 || this.width <= 0) return;
    const g = ctx.createLinearGradient(0, this.y, 0, this.y + this.len);
    g.addColorStop(0,    'rgba(90,0,0,0.95)');
    g.addColorStop(0.6,  'rgba(160,10,10,0.85)');
    g.addColorStop(1,    'rgba(120,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(this.x - this.width / 2, this.y);
    ctx.lineTo(this.x - this.width * 0.15, this.y + this.len * 0.85);
    ctx.arc(this.x, this.y + this.len * 0.85, this.width * 0.55, Math.PI, 0);
    ctx.lineTo(this.x + this.width / 2, this.y);
    ctx.fill();
  }
}

// ---------- КРОВАВАЯ ЛУНА ----------
function drawMoon() {
  const mx = W - 90, my = 90, mr = 48;
  const g = ctx.createRadialGradient(mx, my, 0, mx, my, mr * 3.5);
  g.addColorStop(0,   'rgba(255,90,20,0.30)');
  g.addColorStop(0.5, 'rgba(255,40,10,0.10)');
  g.addColorStop(1,   'rgba(255,40,10,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(mx, my, mr * 3.5, 0, Math.PI * 2); ctx.fill();

  const m = ctx.createRadialGradient(mx - mr * 0.3, my - mr * 0.3, mr * 0.1, mx, my, mr);
  m.addColorStop(0,   '#ffaa60');
  m.addColorStop(0.5, '#e85a20');
  m.addColorStop(1,   '#8e1a08');
  ctx.fillStyle = m;
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = 'rgba(70,15,5,0.28)';
  ctx.beginPath(); ctx.arc(mx - 14, my - 8, 8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + 10, my + 14, 6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + 16, my - 14, 4, 0, Math.PI * 2); ctx.fill();
}

// ---------- ИНИЦИАЛИЗАЦИЯ ----------
const fogs  = OPT.fog  ? Array.from({length:16}, () => new Fog())  : [];
const bats  = OPT.bats ? Array.from({length:7},  () => new Bat())  : [];
const eyes  = OPT.eyes ? Array.from({length:4},  () => new Eyes()) : [];
const blood = OPT.blood? Array.from({length:9},  () => new Blood()): [];

// ---------- ЦИКЛ ----------
function loop() {
  ctx.clearRect(0, 0, W, H);

  if (OPT.scene) {                       // тёмный фон для просмотра в браузере
    ctx.fillStyle = '#08000f';
    ctx.fillRect(0, 0, W, H);
  }

  // мягкий вигнет
  const vg = ctx.createRadialGradient(
    W / 2, H / 2, Math.min(W, H) * 0.35,
    W / 2, H / 2, Math.max(W, H) * 0.85);
  vg.addColorStop(0, 'rgba(10,0,25,0)');
  vg.addColorStop(1, 'rgba(10,0,25,0.22)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  fogs.forEach(f => { f.update(); f.draw(); });
  if (OPT.moon) drawMoon();
  blood.forEach(b => { b.update(); b.draw(); });
  eyes.forEach(e  => { e.update(); e.draw();  });
  bats.forEach(b  => { b.update(); b.draw();  });

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
